# yaml-language-server: $schema=../../scenarios.schema.json
suite: Products API
tags: ["@products-api"]
scenarios:
  - id: API-0030
    name: QUERY search returns only matching products
    status: automated
    automatedIn: tests/api/products/query-products-search.spec.ts
    steps:
      - 'Send QUERY /products/search with Content-Type: application/json, Accept: application/json and the body { "q": "pliers" }.'
      - Verify the response status is 200.
      - Verify the Accept-Query response header is application/json.
      - Verify the body has current_page, data, from, last_page, per_page, to and total.
      - Verify data is not empty and every item's name contains "pliers" (case-insensitive).
  - id: API-0031
    name: QUERY search without a term returns an empty page
    status: automated
    automatedIn: tests/api/products/query-products-search.spec.ts
    steps:
      - "Send QUERY /products/search with Content-Type: application/json, Accept: application/json and an empty JSON object as the body."
      - Verify the response status is 200.
      - Verify data is an empty array.
  - id: API-0032
    name: QUERY search without a JSON Content-Type is rejected
    status: automated
    automatedIn: tests/api/products/query-products-search.spec.ts
    steps:
      - "Send QUERY /products/search with Content-Type: text/plain, Accept: application/json and a plain-text body."
      - Verify the response status is 415.
  - id: API-0072
    name: QUERY search page 2 returns the same products as the GET
    status: automated
    automatedIn: tests/api/products/query-products-search.spec.ts
    steps:
      - Send GET /products/search with q=er and page=2 and keep the item ids in order.
      - 'Send QUERY /products/search with Content-Type: application/json, Accept: application/json and the body { "q": "er", "page": "2" }.'
      - Verify the response status is 200.
      - Verify data is not empty.
      - Verify current_page is 2.
      - Verify the QUERY response's item ids equal the GET response's item ids, in the same order.
