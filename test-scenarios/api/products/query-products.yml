  - id: API-0068
    name: QUERY list with the eco-friendly filter returns the same products as the GET
    status: automated
    automatedIn: tests/api/products/query-products.spec.ts
    steps:
      - Send GET /products with eco_friendly=true and keep the item ids in order.
