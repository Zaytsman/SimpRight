# yaml-language-server: $schema=../../scenarios.schema.json
suite: Products API
tags: ["@products-api"]
scenarios:
  - id: API-0023
    name: Related products are other products from the same category
    status: automated
    automatedIn: tests/api/products/get-products-by-product-id-related.spec.ts
    steps:
      - Send GET /products and take the first item's id.
      - Send GET /products/{productId} with that id and take its category id.
      - Send GET /products/{productId}/related with that id.
      - Verify the response status is 200.
      - Verify the body is an array with at most 10 items.
      - Verify no item has the requested product's id.
      - Verify every item's category id equals the product's category id.
      - Verify every item's category has id and name.
  - id: API-0024
    name: Related products for an unknown product id return 404
    status: automated
    automatedIn: tests/api/products/get-products-by-product-id-related.spec.ts
    knownIssue: Returns 500 instead of 404 for an unknown product id.
    bug: BUG-004
    steps:
      - Send GET /products/{productId}/related with a well-formed ULID that no product has.
      - Verify the response status is 404.
  - id: API-0025
    name: Related products include their CO2 rating
    status: automated
    automatedIn: tests/api/products/get-products-by-product-id-related.spec.ts
    knownIssue: Omits co2_rating from related products, so is_eco_friendly is always false.
    bug: BUG-005
    steps:
      - Send GET /products and take the first item's id.
      - Send GET /products/{productId}/related with that id.
      - Verify every item has a co2_rating field.
