# yaml-language-server: $schema=../../scenarios.schema.json
suite: Products API
tags: ["@products-api"]
scenarios:
  - id: API-0002
    name: List products returns the first page of non-rental products
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    steps:
      - Send GET /products without query parameters.
      - Verify the response status is 200.
      - Verify the body has current_page, data, from, last_page, per_page, to and total.
      - Verify current_page is 1 and per_page is 9.
      - Verify data has at most 9 items.
      - Verify each item has id, name, description, price, is_location_offer, is_rental, co2_rating, in_stock, is_eco_friendly, product_image, a category with id, name and slug, and a brand with id and name.
      - Verify every item's is_rental is false.
      - Verify every item's in_stock is a boolean.
      - Verify every item's is_eco_friendly is true exactly when its co2_rating is A or B.
  - id: API-0003
    name: Filter by brand returns only that brand's products
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    steps:
      - Send GET /products and take the brand id of the first item.
      - Send GET /products with by_brand set to that brand id.
      - Verify the response status is 200.
      - Verify data is not empty and every item's brand id equals that brand id.
  - id: API-0004
    name: Filter by category returns only that category's products
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    steps:
      - Send GET /products and take the category id of the first item.
      - Send GET /products with by_category set to that category id.
      - Verify the response status is 200.
      - Verify data is not empty and every item's category id equals that category id.
  - id: API-0005
    name: Filter by category slug returns the category and its direct sub-categories
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    steps:
      - Send GET /products and take the first item's category id and slug.
      - Send GET /products with by_category_slug set to that slug.
      - Verify the response status is 200.
      - Verify data is not empty.
      - "Verify every item's category is that category or a direct sub-category of it: its category id equals that category id, or GET /products/{productId} for the item returns a category parent_id equal to that category id."
  - id: API-0006
    name: Rental filter returns only rental products
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    steps:
      - Send GET /products with is_rental=true.
      - Verify the response status is 200.
      - Verify every item's is_rental is true.
  - id: API-0007
    name: Price range filter returns only products in the range
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    steps:
      - Send GET /products with between=price,10,30.
      - Verify the response status is 200.
      - Verify every item's price is at least 10 and at most 30.
  - id: API-0008
    name: Sort by price descending orders the products by price
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    steps:
      - Send GET /products with sort=price,desc.
      - Verify the response status is 200.
      - Verify the items' prices are in descending order.
  - id: API-0009
    name: Eco-friendly filter returns only products rated A or B
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    steps:
      - Send GET /products with eco_friendly=true.
      - Verify the response status is 200.
      - Verify every item's co2_rating is A or B (case-insensitive) and its is_eco_friendly is true.
  - id: API-0010
    name: Name filter returns only products whose name contains the text
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    steps:
      - Send GET /products with q=pliers.
      - Verify the response status is 200.
      - Verify data is not empty and every item's name contains "pliers" (case-insensitive).
  - id: API-0011
    name: Spec filter returns only products with that spec value
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    steps:
      - "Find a product with at least one spec: send GET /products/{productId} for the items of GET /products until one returns a non-empty specs array, and take its first spec's spec_name and spec_value."
      - Send GET /products with by_spec=<spec_name>:<spec_value>.
      - Verify the response status is 200.
      - Verify data is not empty.
      - Verify every item's specs, from GET /products/{productId} for the item, include a spec with that spec_name and spec_value.
  - id: API-0012
    name: Page 2 returns the next products
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    steps:
      - Send GET /products and keep the item ids of page 1.
      - Send GET /products with page=2.
      - Verify the response status is 200.
      - Verify current_page is 2.
      - Verify no item id on page 2 is among the page 1 ids.
  - id: API-0013
    name: Unknown category id returns an empty list
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    steps:
      - Send GET /products with by_category set to a well-formed ULID that no category has.
      - Verify the response status is 200.
      - Verify data is an empty array.
  - id: API-0014
    name: Unknown sort column is not a server error
    status: automated
    automatedIn: tests/api/products/get-products.spec.ts
    knownIssue: Returns 500 instead of a client error (or ignoring the column) for an unknown sort column.
    bug: BUG-003
    steps:
      - Send GET /products with sort=no_such_column,asc.
      - Verify the response status is not 500.
  - id: API-0319
    name: Filter by two category ids returns only products of those two categories
    ref: docs/ui/user-stories/Product_Overview.md#AC5
    status: manual
    steps:
      - "Send GET /products and take the category ids of two items that have different categories; when the first page holds only one category, read page=2, 3, ... until a second category is found. Call them category A and category B."
      - Send GET /products with by_category set to category A and take its total as totalA.
      - Send GET /products with by_category set to category B and take its total as totalB.
      - Send GET /products with by_category set to category A's id and category B's id separated by a comma.
      - Verify the response status is 200.
      - Verify data is not empty and every item's category id is category A's id or category B's id.
      - Verify total equals totalA plus totalB, so both categories are present in the result.
  - id: API-0320
    name: Filter by two brand ids returns only products of those two brands
    ref: docs/ui/user-stories/Product_Overview.md#AC7
    status: manual
    steps:
      - "Send GET /products and take the brand ids of two items that have different brands; when the first page holds only one brand, read page=2, 3, ... until a second brand is found. Call them brand A and brand B."
      - Send GET /products with by_brand set to brand A and take its total as totalA.
      - Send GET /products with by_brand set to brand B and take its total as totalB.
      - Send GET /products with by_brand set to brand A's id and brand B's id separated by a comma.
      - Verify the response status is 200.
      - Verify data is not empty and every item's brand id is brand A's id or brand B's id.
      - Verify total equals totalA plus totalB, so both brands are present in the result.
  - id: API-0321
    name: Filter by brand and category together returns only products that match both
    ref: docs/ui/user-stories/Product_Overview.md#AC8
    status: manual
    steps:
      - Send GET /products and take the first item's brand id and category id.
      - Send GET /products with by_brand set to that brand id and by_category set to that category id.
      - Verify the response status is 200.
      - Verify data is not empty.
      - Verify every item's brand id equals that brand id and its category id equals that category id.
  - id: API-0322
    name: A product created with stock 0 is listed as not in stock
    ref: docs/ui/user-stories/Product_Overview.md#AC13
    status: manual
    role: guest
    steps:
      - Send GET /products and take the first item's brand id, category id and product image id.
      - Send POST /products with a unique product name, a positive price, those ids, is_location_offer false, is_rental false and stock 0, and take the new product's id.
      - Verify the response status is 201.
      - Send GET /products with q set to that unique product name, without an Authorization header.
      - Verify the response status is 200.
      - Verify data has exactly one item and its id is the new product's id.
      - Verify that item's in_stock is false.
  - id: API-0323
    name: A product created with stock above 0 is listed as in stock
    ref: docs/ui/user-stories/Product_Overview.md#AC13
    status: manual
    role: guest
    steps:
      - Send GET /products and take the first item's brand id, category id and product image id.
      - Send POST /products with a unique product name, a positive price, those ids, is_location_offer false, is_rental false and stock 10, and take the new product's id.
      - Verify the response status is 201.
      - Send GET /products with q set to that unique product name, without an Authorization header.
      - Verify the response status is 200.
      - Verify data has exactly one item and its id is the new product's id.
      - Verify that item's in_stock is true.
  - id: API-0324
    name: A product created as a rental is listed by the rental filter
    ref: docs/ui/user-stories/Rental_Products.md#AC1
    status: manual
    steps:
      - Send GET /products and take the first item's brand id, category id and product image id.
      - Send POST /products with a unique product name, a positive price, those ids, is_location_offer false, is_rental true and stock 10, and take the new product's id.
      - Verify the response status is 201.
      - Send GET /products with is_rental=true and q set to that unique product name.
      - Verify the response status is 200.
      - Verify data has exactly one item and its id is the new product's id.
      - Verify that item's is_rental is true.
  - id: API-0325
    name: Every rental in the rental list has a name, a description and a product image file name
    ref: docs/ui/user-stories/Rental_Products.md#AC2
    status: manual
    steps:
      - Send GET /products with is_rental=true.
      - Verify the response status is 200.
      - 'Verify data is not empty after ignoring products created by tests (names starting with "Product-").'
      - 'Verify every remaining item has a non-empty name, ignoring products created by tests (names starting with "Product-").'
      - 'Verify every remaining item has a non-empty description, ignoring products created by tests (names starting with "Product-").'
      - 'Verify every remaining item has a product_image with a non-empty file_name, ignoring products created by tests (names starting with "Product-").'
