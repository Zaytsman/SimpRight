# yaml-language-server: $schema=../../scenarios.schema.json
suite: Users API
tags: ["@users-api"]
scenarios:
  - id: API-USER-001
    name: Current user endpoint returns the logged-in user's profile
    automatedIn: tests/api/users/get-users-me.spec.ts
    steps:
      - Send GET /users/me with the default user's token.
      - Verify the response status is 200.
      - Verify email equals the default user's email, and id, first_name and last_name are not empty.
