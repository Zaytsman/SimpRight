# yaml-language-server: $schema=../../scenarios.schema.json
suite: Users API
tags: ["@users-api"]
scenarios:
  - id: API-0063
    name: Current user endpoint returns the logged-in user's profile
    status: automated
    automatedIn: tests/api/users/get-users-me.spec.ts
    steps:
      - Send GET /users/me with the default user's token.
      - Verify the response status is 200.
      - Verify email equals the default user's email, and id, first_name and last_name are not empty.
  - id: API-0100
    name: Current user endpoint returns the admin-only fields to an admin
    status: manual
    role: admin
    steps:
      - Send GET /users/me with the admin's token.
      - Verify the response status is 200.
      - Verify the body's role is "admin".
      - Verify the body's enabled is a boolean and failed_login_attempts is a number.
  - id: API-0101
    name: Current user endpoint hides the admin-only fields from a customer
    status: manual
    steps:
      - Send GET /users/me with the default user's token.
      - Verify the response status is 200.
      - Verify the body has the keys id, provider, first_name, last_name, phone, dob, email, totp_enabled, created_at and address.
      - Verify the body has no role, enabled or failed_login_attempts key.
  - id: API-0102
    name: Current user without a token returns 401
    status: manual
    steps:
      - Send GET /users/me without an Authorization header.
      - Verify the response status is 401.
      - Verify the body's message is "Unauthorized".
  - id: API-0103
    name: Current user with a malformed token returns 401
    status: manual
    steps:
      - Send GET /users/me with a malformed token.
      - Verify the response status is 401.
      - Verify the body's message is "Unauthorized".
  - id: API-0104
    name: Current user with a disabled account's token returns 403
    status: manual
    role: admin
    steps:
      - Send POST /users/register with a unique email, a first name, a last name and a random strong password, and take the new user's id.
      - Send POST /users/login with that email and password, and take its access_token.
      - Send PATCH /users/{userId} with that id and enabled false, with the admin's token.
      - Send GET /users/me with the throwaway customer's access_token.
      - Verify the response status is 403.
      - Verify the body's message is "Account disabled.".
