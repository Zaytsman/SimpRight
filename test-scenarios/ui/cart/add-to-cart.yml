# yaml-language-server: $schema=../../scenarios.schema.json
suite: Cart
tags: ["@cart"]
scenarios:
  - id: UI-002
    name: Add a product with quantity 2 to the cart
    status: automated
    automatedIn: tests/ui/cart/add-to-cart.spec.ts
    steps:
      - 'Create a product for this test through the API: a unique name, in stock.'
      - Search for that product and open it.
      - Set the quantity to 2 and click "Add to cart".
      - Verify the cart badge in the nav bar shows 2.
      - Open the cart.
      - 'Verify the cart has exactly one line: that product with quantity 2.'
      - Verify the cart total equals 2 × the product's unit price.
  - id: UI-027
    name: Adding a product to the cart shows a success message
    ref: docs/ui/user-stories/Product_Detail.md#AC8
    status: manual
    steps:
      - The cart is empty.
      - Open the product "Combination Pliers".
      - Click "Add to cart".
      - Verify the message "Product added to shopping cart." is shown.
