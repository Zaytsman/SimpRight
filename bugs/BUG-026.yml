# yaml-language-server: $schema=./bug.schema.json
id: BUG-026
title: A cart at longitude or latitude 0 gets no location discount, so location offers at London's coordinates (51, 0) aren't discounted
status: open
severity: minor
layer: api
area: carts
affects:
  - POST /carts/{cartId}
  - GET /carts/{cartId}
found: 2026-10-10
ref:
  - docs/api/contracts/Carts_API.md#enums
  - docs/ui/user-stories/Rental_Products.md#AC5
description: >-
  CartService::addItemToCart applies the location discount only when $cart->lat && $cart->lng is true.
  The coordinates are cast to double, so 0 (or any value stored as 0.00) is false and the discount is
  skipped without looking at the city table. London is listed at lat 51, lng 0 with 25 %, so a cart at
  London's own coordinates, or anywhere on the prime meridian, gets no discount; the item's
  discount_percentage stays null, as for a cart without coordinates. Carts a little east or west of it
  (lng 0.01 to 2 or -2 to -0.01) do get 25 %.
steps:
  - Send GET /products and take the id of an item with is_location_offer true.
  - Send POST /carts with lat 51 and lng 0 (London) and take the returned id as the cart's id.
  - Send POST /carts/{cartId} with the cart's id and a body with that product's id as product_id and quantity 1.
  - Send GET /carts/{cartId} with the cart's id.
  - Send DELETE /carts/{cartId} with the cart's id.
expected: >-
  The item has discount_percentage 25 and a discounted_price of its price x 0.75, rounded to 2 decimals:
  a location offer in a cart in a supported city gets that city's discount (Rental_Products.md AC5;
  London 25 % at lat 51, lng 0 in Carts_API.md, Enums), and 0 is a valid coordinate.
actual: The item has discount_percentage null and no discounted_price.
evidence: |-
  Live, 2026-10-10 09:07 UTC (cart deleted afterwards, 204):
  Product: Bolt Cutters (seeded), price 48.41, is_location_offer true
  POST /carts { lat: 51, lng: 0 } -> 201 { id }
  POST /carts/{cartId} { product_id, quantity: 1 } -> 200 {"result":"item added or updated"}
  GET /carts/{cartId} -> 200 with lat 51, lng 0; its only item: discount_percentage null, no discounted_price
  Source (practice-software-testing, sprint5/API), 2026-10-10:
  CartService::addItemToCart: if ($cart->lat && $cart->lng && ...) (0.0 is false)
  Cart model casts lat and lng to double; calculateDiscountPercentage: "london" => ["lat" => 51, "lng" => 0, "discount_percentage" => 25]
