# yaml-language-server: $schema=../node_modules/@simpright/scenarios/schemas/bug.schema.json
id: BUG-046
title: Conditional GET never returns 304 for compressed responses (ETag gets a -gzip suffix)
status: open
severity: minor
layer: api
area: images
affects:
  - GET /images
  - GET /brands
  - GET /brands/search
  - GET /brands/{brandId}
  - GET /categories
  - GET /categories/tree
  - GET /categories/search
  - GET /categories/tree/{categoryId}
  - GET /products
  - GET /products/search
  - GET /products/{productId}
  - GET /products/{productId}/related
  - GET /products/{productId}/specs
  - GET /products/{productId}/specs/{specId}
  - GET /product-specs/names
found: 2026-10-13
ref:
  - docs/api/contracts/Images_API.md#1-list-images
  - docs/api/contracts/Images_API.md#notes
description: >-
  The public GET routes use Laravel's cache.headers:public;max_age=120;etag middleware, which sets an ETag
  (the md5 of the body) and answers 304 when If-None-Match matches it. The API runs on Apache/2.4.52, and
  public/.htaccess turns on mod_deflate for application/json. When Apache gzips a response, mod_deflate adds
  "-gzip" to the ETag, so the client gets "<md5>-gzip". When the client sends that tag back, Laravel compares it
  with the plain "<md5>", finds no match and sends the whole body again with 200. Only the plain tag, which a
  client gets when it asks for no compression, gets 304. Every browser and most HTTP clients (Playwright's request
  API too) accept gzip, so in practice no client ever gets 304. Revalidation doesn't work and every check
  downloads the whole body again. Responses stay correct, so the impact is wasted bandwidth and time. Usual fixes:
  make Apache drop the suffix (DeflateAlterETag Remove, only in newer Apache releases than 2.4.52), or strip
  "-gzip" from If-None-Match before Laravel sees it, or compute the ETag after compression.
steps:
  - 'Send GET /images without an Authorization header, with the headers "Accept: application/json" and "Accept-Encoding: gzip, deflate, br", and take the ETag response header.'
  - Send GET /images with the same headers and the If-None-Match header set to that ETag.
  - 'Send GET /images with "Accept: application/json" and no Accept-Encoding header, and take its ETag.'
  - Send GET /images with the If-None-Match header set to the ETag from the uncompressed response.
expected: >-
  A request whose If-None-Match carries the ETag the server just sent gets 304 Not Modified with an empty body,
  whether or not the response was compressed (RFC 9110 conditional requests; Images_API.md "Conditional request").
actual: >-
  The compressed response's ETag ends in -gzip, and sending it back in If-None-Match returns 200 with the full
  body. Only the plain ETag of an uncompressed response gets 304.
evidence: |-
  Live, 2026-10-13 17:36 UTC, GET without Authorization, Accept: application/json
  GET /images, Accept-Encoding: gzip, deflate, br -> 200, Server: Apache/2.4.52 (Ubuntu),
    Content-Encoding: gzip, Vary: Accept-Encoding, Cache-Control: max-age=120, public,
    ETag: "a65720df8600a86f1ae7a6bec0ff597d-gzip"
  GET /images, no Accept-Encoding -> 200, ETag: "a65720df8600a86f1ae7a6bec0ff597d"
  GET /images, Accept-Encoding: br -> 200, not compressed, ETag: "a65720df8600a86f1ae7a6bec0ff597d"
  If-None-Match "<md5>-gzip" -> 200 (gzip accepted or not)
  If-None-Match "<md5>" -> 304 (gzip accepted or not)
  The same four results on all 15 routes in affects (seeded ids taken from the lists).
  Local run of API-0342 (tests/api/images/get-images.spec.ts, 3 repeats), 2026-10-13: If-None-Match
    "a65720df8600a86f1ae7a6bec0ff597d-gzip" -> 200 with the full list (expected 304).
  Source (practice-software-testing, sprint5/API): routes/api.php defines
    CACHE_HEADERS = 'cache.headers:public;max_age=120;etag' and applies it to the GET routes of brands,
    categories, images, products and product specs; public/.htaccess has
    AddOutputFilterByType DEFLATE application/json (mod_brotli isn't active live).
