# yaml-language-server: $schema=../node_modules/@simpright/scenarios/schemas/bug.schema.json
id: BUG-014
title: Category writes (POST, PUT, PATCH /categories) succeed without a token instead of returning 401
status: open
severity: critical
layer: api
area: categories
affects:
  - POST /categories
  - PUT /categories/{categoryId}
  - PATCH /categories/{categoryId}
found: 2026-10-10
ref:
  - docs/api/contracts/Categories_API.md#authentication
  - docs/api/contracts/Categories_API.md#notes
description: >-
  Anyone can create categories or rename and re-parent seeded ones without logging in: CategoryController
  has no auth middleware on these routes (only DELETE is admin-only), and the OpenAPI spec declares no
  security on them either. The same pattern as BUG-009 (brands) and BUG-001 (products), in a separate controller.
steps:
  - Send POST /categories with a unique name and a unique slug, without an Authorization header, and take the new category's id.
  - Send PUT /categories/{categoryId} for the new category with a new name, without an Authorization header.
  - Send PATCH /categories/{categoryId} for the new category with a new name, without an Authorization header.
expected: Each write without a token returns 401 and changes nothing, like DELETE /categories/{categoryId} without a token.
actual: POST returns 201 and creates the category; PUT and PATCH return 200 and change it.
evidence: |-
  CI run 38372041636 (API Regression Test Run, main, bdddb4b), 2026-10-13, no Authorization header,
  throwaway categories removed as admin by the tests' cleanup
  API-0177 POST /categories { name, slug: unique } -> 201 { name, slug, id } (expected 401), 08:52 UTC
  API-0213 PUT /categories/{categoryId} { name: new } -> 200 {"success":true} (expected 401), 08:52 UTC
  API-0222 PATCH /categories/{categoryId} { name: new } -> 200 {"success":true} (expected 401), 08:52 UTC
  Throwaway category, no Authorization header, 2026-10-13 16:49 UTC
  POST /categories { name, slug: unique } -> 201 { name, slug, id }
  PUT /categories/{categoryId} { name: put name } -> 200 {"success":true}
  GET /categories/tree/{categoryId} -> 200 { name: the put name, parent_id: null, sub_categories: [] }
  PATCH /categories/{categoryId} { name: patch name } -> 200 {"success":true}
  GET /categories/tree/{categoryId} -> 200 { name: the patch name }
  Cleanup as admin: DELETE /categories/{categoryId} -> 204; GET /categories/tree/{categoryId} -> 404
  Source (practice-software-testing, sprint5/API), 2026-10-10: CategoryController::__construct
    applies role:admin only to destroy; store, update and patch have no auth middleware and
    update/patch call categoryService->updateCategory before returning {"success":true}
