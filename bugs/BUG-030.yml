# yaml-language-server: $schema=./bug.schema.json
id: BUG-030
title: Replying to a message that doesn't exist returns 500 instead of 404
status: open
severity: minor
layer: api
area: messages
affects:
  - POST /messages/{messageId}/reply
found: 2026-10-10
ref:
  - docs/api/contracts/Messages_API.md#4-reply-to-message
  - docs/api/contracts/Messages_API.md#notes
description: >-
  POST /messages/{messageId}/reply doesn't check that the message exists. The insert into
  contact_request_replies breaks the foreign key on message_id, which the global handler maps to
  500 { message: "Something went wrong" }. The OpenAPI spec documents 404, and
  PUT /messages/{messageId}/status answers 404 for an unknown id.
steps:
  - Send POST /messages/{messageId}/reply with a well-formed message id that doesn't exist, the admin's token and a body with a message text.
expected: 404 (the spec documents 404 for an unknown message).
actual: >-
  500 with { message: "Something went wrong" } (from the source code; not reproduced live).
evidence: |-
  Not reproduced live, from the source code. Messages_API.md, section 4 "Reply to message" (read from
  ContactController, ContactService and the contact_request_replies migration in sprint5/API,
  2026-10-10): nothing looks the message up; the foreign key violation falls into the handler's
  generic database error branch.
