# yaml-language-server: $schema=../node_modules/@simpright/scenarios/schemas/bug.schema.json
id: BUG-041
title: Create invoice with null or incomplete payment_details returns 500 instead of 422
status: open
severity: major
layer: api
area: invoices
affects:
  - POST /invoices
  - POST /invoices/guest
found: 2026-10-11
ref:
  - docs/api/contracts/Invoices_API.md#8-create-invoice
  - docs/api/contracts/Invoices_API.md#9-create-guest-invoice
description: >-
  payment_details is only required to be present; only gift-card details have validation rules. null fails in the
  controller (Arr::except and handlePayment(array $details)) with a PHP type error, answered as 500 "Server Error".
  For the other methods the details go straight into the method's table: a missing NOT NULL column (bank_name,
  account_name, account_number for bank-transfer) is MySQL error 1364 with SQLSTATE HY000, and app/Exceptions/Handler.php
  checks HY000 before the error code, so it answers 500 "Something went wrong" (its 1364 -> 404 branch is never reached);
  an unknown key or a too long value gives 500 too. The invoice row exists by then (BUG-040).
steps:
  - Register a customer and log in.
  - Send POST /carts with an empty body and take the returned id as the cart's id.
  - Send POST /invoices with the customer's token, payment_method "bank-transfer", payment_details null, billing_street "Stephansplatz 1", billing_city "Wien", billing_country "AT" and the cart's id as cart_id.
  - Send the same POST /invoices with payment_details {}.
  - Send POST /invoices/guest without an Authorization header, with payment_method "bank-transfer", payment_details null, the same billing fields, the cart's id as cart_id, a unique guest_email, a guest_first_name and a guest_last_name.
expected: "422 naming payment_details (or its missing bank_name, account_name and account_number) for each request, and no invoice created."
actual: >-
  500 for each request: { message: "Server Error" } for null on both endpoints, and { message: "Something went wrong" }
  for {} on both endpoints (reproduced live on 2026-10-14: API-0500, API-0508, API-0501; on 2026-10-15: API-0670 for
  {} on POST /invoices/guest, and API-0668 for null on POST /invoices again).
evidence: |-
  2026-10-14 18:54 UTC, throwaway customers (token ***), an empty cart from POST /carts for each request,
  billing_street "Stephansplatz 1", billing_city "Wien", billing_country "AT":
  POST /invoices { payment_method: "bank-transfer", payment_details: null, ... } -> 500 { message: "Server Error" } (API-0500)
  POST /invoices { payment_method: "bank-transfer", payment_details: {}, ... } -> 500 { message: "Something went wrong" } (API-0501)
  POST /invoices/guest { payment_method: "bank-transfer", payment_details: null, guest fields, ... }
    -> 500 { message: "Server Error" } (API-0508)
  2026-10-15 17:38 UTC, API-0670 (tests/api/invoices/post-invoices-guest.spec.ts, repeated x3, same result), no token,
  Accept: application/json, an empty cart from POST /carts, the same billing fields, guest fields (email ***):
  POST /invoices/guest { payment_method: "bank-transfer", payment_details: {}, ... } -> 500 { message: "Something went wrong" }
  2026-10-15 ~17:37 UTC, API-0668 (repeated x3): POST /invoices { payment_method: "bank-transfer", payment_details: null, ... }
    -> 500 { message: "Server Error" }; the invoice row was left behind (BUG-040).
  Source (sprint5/API, c6032ad): StoreInvoice and InvoiceController::storeGuest ("payment_details" => ['present']);
  InvoiceController::store and storeGuest (Arr::except on payment_details); Handler.php (HY000 checked before 1364);
  migration payment_bank_transfer_details (bank_name, account_name, account_number NOT NULL).
