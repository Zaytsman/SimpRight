# yaml-language-server: $schema=./bug.schema.json
id: BUG-041
title: Create invoice with malformed payment_details returns 500 or 404 instead of 422
status: open
severity: minor
layer: api
area: invoices
affects:
  - POST /invoices
  - POST /invoices/guest
found: 2026-10-11
ref:
  - docs/api/contracts/Invoices_API.md#8-create-invoice
  - docs/api/contracts/Invoices_API.md#9-create-guest-invoice
description: >-
  Only the gift-card details have validation rules. For the other methods the details go straight into the payment
  table: null, an unknown key or a too long value ends in a database error, mapped to 500, and a missing required
  column (for example bank_name) is mapped by the global handler to 404 "Something went wrong".
steps:
  - Create a cart.
  - Send POST /invoices with payment_method "bank-transfer", payment_details null and the cart's id (a customer's token).
  - Send POST /invoices with payment_method "bank-transfer", payment_details {} and the cart's id (a customer's token).
  - Send POST /invoices/guest with payment_method "bank-transfer", payment_details null, the cart's id and the guest fields.
expected: "422 naming payment_details for each request."
actual: "500 for null, and 404 { message: \"Something went wrong\" } for {} (from the source code; not reproduced live)."
evidence: |-
  Invoices_API.md, endpoints 8 and 9 and Error Handling (read from InvoiceService, StoreInvoice and
  app/Exceptions/Handler.php in sprint5/API). No token was available when the contract was written, so the calls were not made live.
