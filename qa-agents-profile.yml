# yaml-language-server: $schema=./qa-agents-profile.schema.json
#
# What the QA agents and scripts need to know about this project. Agents read this file
# first; scripts/validate-scenarios.mts reads it too and checks that every path below exists.
# It holds facts and pointers, not conventions: those stay in the files listed under
# project.conventions, and the exemplars show the style to copy.

project:
  language: typescript
  runner: playwright
  conventions: [CLAUDE.md]                  # prose rules the agents must read

paths:
  scenarios: test-scenarios                 # <layer>/<area>/<name>.yml
  scenarioSchema: test-scenarios/scenarios.schema.json
  contracts: docs/api/contracts
  tests: tests                              # <layer>/<area>/<name>.spec.ts
  apiTests: tests/api
  coverageSummary: test-results/api-coverage/summary.json   # generated by an API run; may not exist

commands:
  typecheck: npm run typecheck
  validateScenarios: npm run validate:scenarios
  runSpec: npx playwright test {spec}
  runScenario: npx playwright test -g "{id}"

ids:
  # Scenario IDs are <LAYER>-<AREA>-NNN. A scenario file lives in <layer>/<area>/<name>.yml.
  layers: { ui: UI, api: API }
  areas: { products: PROD, users: USER, cart: CART }
  fileNames:
    # API: <method>-<endpoint path>, one file per endpoint, e.g. GET /products/search -> products/get-products-search.yml.
    # {area} is replaced with the folder name, so the path part starts with the API name.
    # Other layers: any kebab-case name (UI files are named after their spec).
    api: "^(get|post|put|patch|delete)-{area}(-[a-z0-9]+)*$"

roles: [default, admin]                     # a scenario role must be one of these; set with test.use({ role: 'admin' })

api:
  exemplars:
    client: src/api/clients/ProductsClient.ts
    service: src/api/services/ProductsService.ts
    dto: src/api/dto/product.ts
    fixtures: src/api/fixtures/fixtures.ts  # new clients and services are registered here
    spec: tests/api/users/current-user.spec.ts
  knownIssue: "test.info().annotations.push({ type: 'issue', description: 'Known issue: {text}' })"
  rules:
    - Happy paths go through a service; status-code checks go through the client.
    - Specs import from @fixtures and never construct clients or services.

liveApi:
  writes: ask                               # never | ask | allowed
  dangerous:
    - Repeated failed logins lock the account (423). Use a throwaway user, never the shared test users.
