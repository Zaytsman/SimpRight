# yaml-language-server: $schema=./simpright.schema.json
#
# The project's toolchain config: what the QA agents and scripts need to know about this project.
# Agents read this file first; scripts/validate-scenarios.mts reads it too, checks that every path
# below exists and that the runs match their workflows. Tests never read it: their config is
# src/envs/<ENV>.json and .env.
# It holds facts and pointers, not conventions: those stay in the files listed under
# project.conventions, and the exemplars show the style to copy.

project:
  language: typescript
  runner: playwright
  conventions: [CLAUDE.md]                  # prose rules the agents must read

paths:
  scenarios: test-scenarios                 # <layer>/<area>/<name>.yml
  scenarioSchema: test-scenarios/scenarios.schema.json
  bugs: bugs                                # <ID>.yml, one per bug in the app under test (BUG-001.yml)
  bugSchema: bugs/bug.schema.json
  contracts: docs/api/contracts
  contractFormat: docs/api/CONTRACT_FORMAT.md   # the contract format specification (a copy of the coverage package's)
  tests: tests                              # <layer>/<area>/<name>.spec.ts
  apiTests: tests/api
  uiTests: tests/ui
  pages: src/ui/pages                       # page objects; components/ and dialogs/ inside
  flows: src/ui/flows                       # multi-page user journeys
  userStories: docs/ui/user-stories         # user stories, bug reports and acceptance criteria: input for the analyst and the UI scenario writer
  analysis: docs/analysis                   # analysis documents and test plans, one per work item (/analyze-requirements)
  testData: src/data                        # TestConstants.ts, factories/<Area>Factory.ts
  coverageSummary: test-results/api-coverage/summary.json   # generated by an API run; may not exist

commands:
  typecheck: npm run typecheck
  validateScenarios: npm run validate:scenarios
  # Agents run headless (HEADLESS=true); a person's local UI runs show the browser by default. Agent runs also skip the
  # API coverage report (DISABLE_API_COVERAGE=true): one spec's report says nothing, and it prints after the results.
  runSpec: HEADLESS=true DISABLE_API_COVERAGE=true npx playwright test {spec}
  runScenario: HEADLESS=true DISABLE_API_COVERAGE=true npx playwright test -g "{id}:"
  repeatSpec: HEADLESS=true DISABLE_API_COVERAGE=true npx playwright test {spec} --repeat-each=3   # flakiness check after a spec passes
  # Page inspector (read-only): data-test elements + accessibility tree of {path} (relative to baseUrl).
  # Options: --role <role> | --logged-out; --then <step>, repeatable: click:<data-test> (tabs, menus, links),
  # "check:<label>" (a filter checkbox), "select:<data-test>=<option label>" (a sort order). Steps change no data.
  inspectUi: npm run inspect:ui -- {path}
  # CI runs (GitHub Actions, needs gh logged in): the run's workflow, branch, commit and time, and the logs of its failed steps.
  ciRunInfo: gh run view {run} --json workflowName,headBranch,headSha,createdAt,conclusion,jobs
  ciFailedLog: gh run view {run} --log-failed
  # Contract commands come from the optional coverage package (@zaytsman/playwright-api-coverage); without it they can't run.
  validateContracts: npx --no-install playwright-api-coverage validate docs/api/contracts
  diffContracts: npx --no-install playwright-api-coverage diff docs/api/contracts {spec}
  contractsFromOpenApi: npx --no-install playwright-api-coverage from-openapi {spec}

ids:
  # Scenario IDs are <PREFIX>-<number>, numbered across the whole layer, not per area: API-0001, UI-001.
  # A new scenario takes the next free number of its layer (validate:scenarios prints it).
  # A scenario file lives in <layer>/<area>/<name>.yml, with an area from the list below.
  layers:
    ui: { prefix: UI, digits: 3 }
    api: { prefix: API, digits: 4 }
  areas: [products, users, cart, carts, brands, categories, favorites, images, invoices, messages, account, reports, payment, postcode, product-specs]   # cart: UI (the cart page); carts: API (/carts endpoints); account: UI (the /account pages); product-specs: API /product-specs/* only (/products/{productId}/specs files go in products)
  # Bug IDs: BUG-001, one number sequence for all bugs (validate:scenarios prints the next free one).
  # One bug per root cause: scenarios that hit the same defect name the same bug.
  bugs: { prefix: BUG, digits: 3 }
  fileNames:
    # API: <method>-<endpoint path>, one file per endpoint, e.g. GET /products/search -> products/get-products-search.yml.
    # {area} is replaced with the folder name, so the path part starts with the API name.
    # Other layers: any kebab-case name (UI files are named after their spec).
    api: "^(get|post|put|patch|delete|query)-{area}(-[a-z0-9]+)*$"

# A scenario role must be one of these. default (the run's customer) and admin log in: test.use({ role: 'admin' }).
# guest is a logged-out visitor: test.use({ authMode: 'none' }).
roles: [default, admin, guest]

api:
  exemplars:
    client: src/api/clients/ProductsClient.ts
    service: src/api/services/ProductsService.ts
    dto: src/api/dto/product.ts
    fixtures: src/api/fixtures/fixtures.ts  # new clients and services are registered here
    spec: tests/api/products/get-products-search.spec.ts
    helpers: src/utils/assertHelpers.ts     # assertMessage, attachJson, redact
    checks: src/utils/apiChecks.ts          # the shared checks: the app's own, plus src/utils/httpChecks.ts re-exported (parseJson, expectStatus, expectStatusAndBody, expectSomeItems, ...)
    steps: src/api/fixtures/apiSteps.ts     # AUTH labels, page summaries, templates (checkRejectedBody), plus src/api/fixtures/sendSteps.ts re-exported (sendAndAttach, checkStatusAndMessage)
    cleanup: src/fixtures/base.ts           # the cleanup fixture
    constants: src/data/TestConstants.ts    # shared seeded values
    testDataUtils: src/data/factories/testDataUtils.ts   # uniqueName for created records
  # Known-issue line of a test whose scenario has knownIssue and bug, right before its first test.step (after any setup,
  # so a failed setup stays a real failure); Playwright records it as a 'fail' annotation.
  knownIssue: "test.fail(true, 'Known issue {bug}: {text}');"
  rules:
    - Happy paths go through a service; any step that checks a status code goes through the client.
    - Specs import from @fixtures and never construct clients or services.
    - Every assertion passes assertMessage({ request, expected, actual }); a bare expect without a message is forbidden.
    - Payloads are attached with attachJson, never test.info().attach, so secrets are masked (reports are public).
    - Compare secret values (a test user's email) as a condition, e.g. expect(a === b, message).toBe(true), so a failure diff doesn't print them.
    - Records a test creates are removed through the cleanup fixture (cleanup.add), not afterAll.
    - Reuse the shared checks (api.exemplars.checks), the step helpers (api.exemplars.steps) and the area's src/api/fixtures/<area>Steps.ts, and parse bodies with parseJson; a spec never redefines them. Tests that differ only in their data share one template function, called from a literal test() per scenario.
    - Seeded values more than one test relies on go in TestConstants; a value one test uses stays a variable in that test.
    - Create/update payloads come from a factory per area (src/data/factories/<Area>Factory.ts, created with the first scenario that needs it), with uniqueName for every created record.

ui:
  exemplars:
    page: src/ui/pages/HomePage.ts
    basePage: src/ui/pages/AppPage.ts      # pages extend this, the app's base page (navBar, toast); it extends the core BasePage
    component: src/ui/pages/components/ProductGrid.ts
    baseComponent: src/ui/pages/components/BaseComponent.ts   # components extend this; locators start from root
    dialog: src/ui/pages/dialogs/BaseDialog.ts   # no concrete dialog yet: subclasses extend this
    flow: src/ui/flows/ShoppingFlow.ts
    fixtures: src/ui/fixtures/fixtures.ts   # new pages, components, dialogs and flows are registered here
    preconditionFixture: src/ui/fixtures/preconditions/openHomePageTest.ts
    fixturesIndex: src/fixtures/index.ts    # precondition fixtures are exported here
    spec: tests/ui/products/product-search.spec.ts
    constants: src/data/TestConstants.ts
  # Known-issue line of a test whose scenario has knownIssue and bug, placed like the API one (the same annotation).
  knownIssue: "test.fail(true, 'Known issue {bug}: {text}');"
  rules:
    - Specs import from @fixtures and get pages, components, flows and API services from fixtures; they never construct them, call page.goto or use selectors.
    - Page object locators are private readonly fields named with the element kind (searchCaptionText); a test reaches one only through a noun getter (get searchCaption()), added when a test asserts on it. Dynamic locators are methods with parameters (card(name)).
    - Locator priority is getByTestId (data-test), then getByRole, getByLabel or getByText, then CSS; never XPath. Take data-test ids and labels from commands.inspectUi, never guess them.
    - No assertions in page objects. An action waits for the app's own signal (a marker, a toast, the next page's element, or its request through waitForApiResponse), never a fixed sleep. Amounts are read with parseAmount.
    - Every new page object, dialog and flow, and every component used outside a page, is registered as a fixture in ui.exemplars.fixtures; a component a page holds is reached through that page's field (homePage.productGrid).
    - A scenario's preconditions are set up before the first step, never in a test.step; a precondition fixture (open<Page>Test, no test.step inside) when tests share one, imported as test so the validator finds the titles; otherwise setup code with a // Precondition comment.
    - Every assertion carries a plain-text message saying what is checked.
    - Data a UI test needs (a customer, a product, a cart) is prepared and removed through the API (putProductInCart, findProductByName and registerCustomerForTest in src/ui/fixtures/, cleanup.add), never through the UI and never in a test.step; a setup failure throws an error starting with Setup:.
    - UI suite tags are @<area> (@products, @cart); API tags are @<area>-api.
    - The inspector is read-only; its steps click tabs, menus and links, check filters and pick list options, never type or submit.

liveApi:
  # Applies to UI tests too: a UI test that changes data (an order, a registration, a profile change) is a write.
  writes: ask                               # never | ask | allowed
  dangerous:
    - Repeated failed logins lock the account (423), through the API or the login page. Use a throwaway user, never the shared test users.
  # Known ways the live app misbehaves for a while; the healer checks failures against them and never re-runs inside these windows.
  transient:
    - The demo site re-seeds every hour at :00 UTC. For a minute or two, calls fail with 500 (register, login), and brands, categories and products get new ids.
    - Cloudflare in front of the site shows an interactive bot check ("Performing security verification", "Verify you are human") on most direct page loads of /checkout from GitHub-hosted runners (first seen 2026-10-17, run 39052798735); other paths and local runs aren't checked. AppPage.goto() then fails with "Blocked by the site's Cloudflare bot check (environment)". Re-running doesn't help. CartPage.open() avoids it by clicking the nav bar's cart link (opening / first only when no page of the app is open); only openWithoutCart() (UI-052) still loads /checkout directly and can be blocked.
    - GET /products answers from a 5-minute cache, so right after a re-seed it can return ids that no longer exist (a POST with them returns 500).
    - The site sometimes slows down for minutes, and plain calls time out (login after 30 s, GET /products after 10 s) across many unrelated tests at once; a slowdown can end with a few seconds of login 500s.
    - Product writes need no token, so other visitors can change or delete seeded products at any time (stock, price, category). Tests on seeded records can fail without any change on our side.
    - A locked account (423) stays locked for a while; re-running login tests only extends it.
    - GET /product-specs/names answers from a 300-second cache. A parallel call right after a spec write can cache the old list again, so a just-created or just-deleted spec name can be missing or still listed for up to 5 minutes (API-0575, API-0576).

# The framework's optional parts and whether this project uses them.
parts:
  scenarios: true                           # test-scenarios/ and bugs/, checked by validate:scenarios
  inspector: true                           # commands.inspectUi
  agents: true                              # the QA agents and skills in .claude/
  coverage:                                 # loaded by src/api/coverage/apiCoverage.ts when installed
    package: '@zaytsman/playwright-api-coverage'
    registry: https://npm.pkg.github.com
  portal:                                   # the Automation Portal on GitHub Pages
    testCases: true
    bugs: true
  wiki: true                                # docs/wiki/ published to the GitHub wiki

# The framework's core: the files a project gets from the template and keeps generic. A core file imports only other
# core files, the seams and packages (validate:scenarios checks it); the app's code goes in the project's own files.
core:
  files:
    - src/config/env.ts                     # the environment config, the users, the roles (from the seam)
    - src/config/defineProject.ts           # the shape of the project file
    - src/utils/envUtils.ts
    - src/utils/assertHelpers.ts            # masking, assertion messages, attachments
    - src/utils/httpChecks.ts               # the HTTP-level API checks
    - src/api/clients/BaseClient.ts
    - src/api/services/serviceUtils.ts
    - src/api/auth/TokenService.ts
    - src/api/coverage/apiCoverage.ts
    - src/api/fixtures/sendSteps.ts         # sendAndAttach and the generic templates
    - src/ui/auth/authState.ts
    - src/ui/pages/BasePage.ts
    - src/ui/pages/components/BaseComponent.ts
    - src/ui/pages/dialogs/BaseDialog.ts
    - src/ui/pages/waitForApiResponse.ts
    - src/fixtures/base.ts                  # role, authMode, config, tokenService, storageState, user, cleanup
    - src/data/factories/testDataUtils.ts   # uniqueName
    - src/globalSetup.ts
    - scripts/inspect-ui.mts                # the page inspector
    - scripts/inspect-ui/inspect-page.spec.ts
    - playwright.config.ts
  seams:
    - src/config/roles.ts                   # the roles tests act as
    - src/config/project.ts                 # the app's test ids, logins and run hooks

ci:
  branches: { default: main, work: develop }
  node: 24                                  # every actions/setup-node step uses it (the workflows pass it to the setup action)
  secrets: [ADMIN_USER, ADMIN_PASSWORD]     # names of the repository secrets the tests read, never values

# One entry per test run: its report family on GitHub Pages (id) and the caller of
# .github/workflows/playwright-run.yml that runs it; validate:scenarios checks each caller against its entry.
# Every run can be started by hand; schedule adds a cron in UTC (never on the full hour: the site re-seeds at :00).
runs:
  - id: daily-ui-regression
    label: UI regression
    note: Latest daily run
    project: ui
    schedule: '15 6 * * 1-5'
    trend: ui
  - id: daily-api-regression
    label: API regression
    note: Latest daily run
    project: api
    schedule: '15 2 * * 1-5'
    trend: api
    publishCoverage: true                   # the only run whose coverage represents the whole suite
  - id: smoke
    label: Smoke
    note: UI + API
    project: all
    grep: '@smoke'
  - id: custom-ui
    label: Custom UI
    note: Latest custom run
    project: ui
    areaPicker: true                        # the area options are the folders in paths.uiTests
  - id: custom-api
    label: Custom API
    note: Latest custom run
    project: api
    areaPicker: true

# The Automation Portal's text. index.html reads it, with the runs above, from portal.json
# (written on every publish, scripts/lib/site.mts); the Test Cases and Bugs pages from their data files.
portal:
  title: SimpRight
  titleAccent: Right                        # the end of the title in the accent color
  tagline: Automation Framework
  description: Automated UI and API tests for the Toolshop (practicesoftwaretesting.com), built with TypeScript and Playwright.
  healthThreshold: { ui: 1, api: 1 }        # % failed below which a layer's latest regression counts as healthy
