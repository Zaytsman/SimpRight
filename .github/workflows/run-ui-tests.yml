name: UI Regression Test Run

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules run in UTC: 06:15 UTC on weekdays (09:15 Kyiv in summer, 08:15 in winter).
    # Never on the full hour: the site re-seeds its data at :00, and GitHub's queue is busiest then.
    - cron: '15 6 * * 1-5'

permissions:
  contents: write
  packages: read

jobs:
  ui-tests:
    uses: ./.github/workflows/playwright-run.yml
    secrets:
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    with:
      project: ui
      family: daily-ui-regression
