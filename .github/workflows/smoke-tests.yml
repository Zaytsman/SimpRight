# Generated by simpright apply from simpright.yml: change simpright.yml, then run simpright apply.
name: Smoke test run

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  tests:
    uses: ./.github/workflows/playwright-run.yml
    secrets:
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    with:
      project: all
      family: smoke
      grep: '@smoke'
