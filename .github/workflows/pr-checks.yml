name: PR Checks

# Required status check for pull requests (the `verify` job; see the main branch ruleset).
# Typecheck and scenario validation always run. The tests run only as far as the change needs
# (scripts/pr-test-scope.sh): the whole suite, only the specs the changed files reach, or none.
# Pull requests from forks get no repository secrets, so they run the static checks only.
# It stays one job with conditional steps: a required check that is skipped never reports.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: read # install the optional coverage package

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Secrets are read by src/config/env.ts from the environment (no .env file on CI).
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      HAS_SECRETS: ${{ secrets.ADMIN_USER != '' }}
      BASE_REF: origin/${{ github.base_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history, so the base branch is there to diff against.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Lets npm ci install the optional private coverage package with NODE_AUTH_TOKEN.
          registry-url: https://npm.pkg.github.com
          scope: '@zaytsman'

      - name: Install dependencies
        run: npm ci
        env:
          # Read access to the private coverage package (granted to this repo in the package settings).
          # Without access (e.g. in a fork) the optional package is skipped and the tests run without coverage.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Validate scenarios
        run: npm run validate:scenarios

      # The Test Cases pages are published from main (publish-test-cases.yml); check that they still build.
      - name: Build test case pages
        run: npm run test-cases:build

      - name: Decide test scope
        id: scope
        run: bash scripts/pr-test-scope.sh "$BASE_REF"

      - name: Note skipped tests
        if: env.HAS_SECRETS != 'true' || steps.scope.outputs.scope == 'none'
        run: |
          if [ "$HAS_SECRETS" != 'true' ]; then
            echo "::notice::No test user secrets available (fork or Dependabot pull request); tests were skipped."
          else
            echo "::notice::No file that the tests depend on changed; tests were skipped."
          fi

      - name: Cache Playwright browsers
        if: env.HAS_SECRETS == 'true' && steps.scope.outputs.scope != 'none'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: env.HAS_SECRETS == 'true' && steps.scope.outputs.scope != 'none'
        run: npm run install:browsers

      - name: Run all tests
        if: env.HAS_SECRETS == 'true' && steps.scope.outputs.scope == 'all'
        run: npx playwright test

      - name: Run tests affected by the change
        if: env.HAS_SECRETS == 'true' && steps.scope.outputs.scope == 'changed'
        # Changed code that no spec imports selects no tests, which is a pass.
        run: npx playwright test --only-changed="$BASE_REF" --pass-with-no-tests

      - name: Upload report artifact
        if: ${{ failure() && env.HAS_SECRETS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.pull_request.number }}-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
