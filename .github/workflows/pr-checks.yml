name: PR Checks

# Required status check for pull requests (the `verify` job; see the main branch ruleset).
# Pull requests from forks get no repository secrets, so they run the typecheck only.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Secrets are read by src/config/env.ts from the environment (no .env file on CI).
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      DEFAULT_USER: ${{ secrets.DEFAULT_USER }}
      DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
      HAS_SECRETS: ${{ secrets.ADMIN_USER != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Note skipped tests
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::No test user secrets available (fork or Dependabot pull request); tests were skipped."

      - name: Cache Playwright browsers
        if: env.HAS_SECRETS == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: env.HAS_SECRETS == 'true'
        run: npm run install:browsers

      - name: Run tests
        if: env.HAS_SECRETS == 'true'
        run: npx playwright test

      - name: Upload report artifact
        if: ${{ failure() && env.HAS_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
