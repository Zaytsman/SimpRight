name: PR Checks

# Required status check for pull requests (the `verify` job; see the main branch ruleset).
# Static checks only: typecheck, scenario validation and the Test Cases and Bugs page builds.
# The tests don't run here: they run locally before a push, and nightly on main.
# It installs without the private coverage package (nothing here loads it), so forks and Dependabot get the same check.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Without a token npm skips the optional private package (GitHub Packages answers 401), as in forks.
      # --omit=optional would also drop TypeScript's compiler, which comes as an optional platform package.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Validate scenarios
        run: npm run validate:scenarios

      # The Test Cases and Bugs pages and the portal's portal.json are published from main (publish-test-cases.yml); check that they still build.
      - name: Build the Test Cases and Bugs pages and portal.json
        run: |
          npm run test-cases:build
          npm run bugs:build
          npm run portal:build
