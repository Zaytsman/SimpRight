name: PR Checks

# Required status check for pull requests (the `verify` job; see the main branch ruleset).
# Static checks only: typecheck, scenario validation, the project's setup (the core vs SimpRightTemplate included)
# and the build of the portal's pages.
# The tests don't run here: they run locally before a push, and nightly on main.
# It installs without the private coverage package (nothing here loads it), so forks and Dependabot get the same check.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The local action below runs from this checkout.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without a token npm skips the optional private package (GitHub Packages answers 401), as in forks.
      # --omit=optional would also drop TypeScript's compiler, which comes as an optional platform package.
      - name: Set up Node.js and install
        uses: ./.github/actions/setup
        with:
          node-version: 24

      - name: Typecheck
        run: npm run typecheck

      - name: Validate scenarios
        run: npm run validate:scenarios

      # simpright.yml, the runs against their workflows, the local actions and the core boundary; and the core files
      # must match SimpRightTemplate at the version simpright.yml records (template), so a core change reaches the
      # template before it reaches main. Reads the public template from GitHub, no token.
      - name: Check the project's setup
        run: npm run doctor

      # The Test Cases and Bugs pages and the dashboard's portal.json are published from main by the same command
      # (publish-test-cases.yml); check that they still build.
      - name: Build the portal's pages
        run: npx --no-install simpright-portal build-pages --site test-results/site
