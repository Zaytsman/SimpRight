name: PR Checks

# Required status check for pull requests (the `verify` job; see the main branch ruleset).
# Static checks only: typecheck, scenario validation and the Test Cases and Bugs page builds.
# The tests don't run here: they run locally before a push, and nightly on main.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: read # install the optional coverage package

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Lets npm ci install the optional private coverage package with NODE_AUTH_TOKEN.
          registry-url: https://npm.pkg.github.com
          scope: '@zaytsman'

      - name: Install dependencies
        run: npm ci
        env:
          # Read access to the private coverage package (granted to this repo in the package settings).
          # Without access (e.g. in a fork) the optional package is skipped.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Validate scenarios
        run: npm run validate:scenarios

      # The Test Cases and Bugs pages are published from main (publish-test-cases.yml); check that they still build.
      - name: Build test case and bug pages
        run: |
          npm run test-cases:build
          npm run bugs:build
