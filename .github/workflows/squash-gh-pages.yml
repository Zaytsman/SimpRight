name: Squash GitHub Pages History

# Replaces the gh-pages branch's history with one commit of the current site (the squash-pages action).
# Each publish adds a full report to the history, so without this the branch grows forever even though
# the site keeps only the latest runs. The site itself doesn't change. Monthly, and by hand.

on:
  workflow_dispatch:
  schedule:
    # 04:45 UTC on the 1st: between the nightly API (02:15) and UI (06:15) runs, never on the hour.
    - cron: '45 4 1 * *'

permissions:
  contents: write # force-push gh-pages

concurrency:
  group: squash-gh-pages
  cancel-in-progress: false

jobs:
  squash:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The local action below runs from this checkout.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the squash step gets a token.
          persist-credentials: false

      - name: Squash gh-pages
        uses: ./.github/actions/squash-pages
        with:
          token: ${{ github.token }}
