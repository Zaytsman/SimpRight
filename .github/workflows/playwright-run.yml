name: Playwright Run (reusable)

# Shared job for all test workflows: runs one Playwright project (or all of them) and publishes
# the report to GitHub Pages (gh-pages branch) under the given report family.

on:
  workflow_call:
    inputs:
      project:
        description: 'Playwright project: ui, api, or all (both in one run, e.g. the smoke set)'
        required: true
        type: string
      family:
        description: 'Report family folder on GitHub Pages, e.g. daily-ui-regression'
        required: true
        type: string
      paths:
        description: 'Spec folders or files to run (empty = the whole project)'
        required: false
        type: string
        default: ''
      grep:
        description: 'Only run tests whose title matches (e.g. a scenario ID)'
        required: false
        type: string
        default: ''
      publish-latest-coverage:
        description: 'Publish this run''s API coverage as latest/api-coverage'
        required: false
        type: boolean
        default: false
      keep-runs:
        description: 'How many runs of the family stay on GitHub Pages; older ones are removed when this run is published'
        required: false
        type: number
        default: 10
    # Only the secrets the tests read; callers pass them by name instead of `secrets: inherit`.
    secrets:
      ADMIN_USER:
        required: true
      ADMIN_PASSWORD:
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write # push to gh-pages
      packages: read # install the optional coverage package

    env:
      # Secrets are read by src/config/env.ts from the environment (no .env file on CI).
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token in the git config while dependencies install and tests run; only the publish step gets one.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          # Lets npm ci install the optional private coverage package with NODE_AUTH_TOKEN.
          registry-url: https://npm.pkg.github.com
          scope: '@zaytsman'

      - name: Install dependencies
        # No dependency needs an install script, so none runs while NODE_AUTH_TOKEN is set.
        run: npm ci --ignore-scripts
        env:
          # Read access to the private coverage package (granted to this repo in the package settings).
          # Without access (e.g. in a fork) the optional package is skipped and the tests run without coverage.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright browsers
        if: inputs.project != 'api'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: inputs.project != 'api'
        run: npm run install:browsers

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          # UI runs only hit the API to log in, and a mixed run (all) covers a few endpoints only,
          # so their API coverage would be misleading.
          DISABLE_API_COVERAGE: ${{ inputs.project != 'api' && 'true' || 'false' }}
          PROJECT: ${{ inputs.project }}
          SPEC_PATHS: ${{ inputs.paths }}
          GREP: ${{ inputs.grep }}
        run: |
          args=()
          [ "$PROJECT" != all ] && args+=(--project="$PROJECT")
          [ -n "$GREP" ] && args+=(--grep "$GREP")
          # SPEC_PATHS is a space-separated list of spec folders/files.
          npx playwright test "${args[@]}" $SPEC_PATHS

      # Warns (an annotation per test) when a test's step titles aren't its scenario's steps verbatim; doesn't fail the job.
      - name: Check step titles
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        continue-on-error: true
        run: npm run check:step-titles

      - name: Publish report to GitHub Pages
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          # The push credential for gh-pages (scripts/gh-pages-lib.sh); the checkout kept none.
          GH_TOKEN: ${{ github.token }}
          FAMILY: ${{ inputs.family }}
          LATEST_COVERAGE: ${{ inputs.publish-latest-coverage }}
          KEEP_RUNS: ${{ inputs.keep-runs }}
        run: |
          args=("$FAMILY")
          [ "$LATEST_COVERAGE" = true ] && args+=(--latest-coverage)
          scripts/publish-report.sh "${args[@]}"

      - name: Upload report artifact
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.family }}-run-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        env:
          FAMILY: ${{ inputs.family }}
        run: |
          echo "::error::Tests failed. Report: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${FAMILY}/run-${GITHUB_RUN_NUMBER}/"
          exit 1
