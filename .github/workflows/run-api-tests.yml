name: API Regression Test Run

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules run in UTC: 02:15 UTC on weekdays (05:15 Kyiv in summer, 04:15 in winter).
    # Never on the full hour: the site re-seeds its data at :00, and GitHub's queue is busiest then.
    - cron: '15 2 * * 1-5'

permissions:
  contents: write
  packages: read

jobs:
  api-tests:
    uses: ./.github/workflows/playwright-run.yml
    secrets:
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    with:
      project: api
      family: daily-api-regression
      # The full regression is the only run whose coverage represents the whole suite.
      publish-latest-coverage: true
