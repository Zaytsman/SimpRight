name: Publish Wiki

# Copies docs/wiki/ to the repository's GitHub wiki (<repo>.wiki.git) whenever it changes on main,
# so the wiki shows the documentation of the merged code. docs/wiki/ is the source: pages added,
# changed or removed there are added, changed or removed in the wiki, and edits made in the wiki's
# web editor are overwritten by the next publish. Can also be run by hand.
#
# The wiki's git repository exists only after its first page was created in the web UI
# (Settings → General → Features → Wikis, then "Create the first page").

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
      - '.github/actions/publish-wiki/**'
  workflow_dispatch:

permissions:
  contents: write # push to the wiki repository

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The local action below runs from this checkout.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push uses its own URL with the token.
          persist-credentials: false

      - name: Sync docs/wiki to the wiki
        uses: ./.github/actions/publish-wiki
        with:
          source: docs/wiki
          token: ${{ github.token }}
