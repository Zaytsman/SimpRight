name: Custom API Test Run

on:
  workflow_dispatch:
    inputs:
      area:
        description: 'API area to run (a folder in tests/api)'
        required: true
        default: 'all'
        type: choice
        # The folders in tests/api: validate:scenarios checks them (the custom-api run in simpright.yml).
        options:
          - all
          - products
          - users
          - carts
          - payment
          - postcode
          - brands
          - categories
          - product-specs
          - favorites
          - images
          - reports
          - messages
          - invoices
      grep:
        description: 'Optional: only tests whose title matches, e.g. API-0001'
        required: false
        type: string
        default: ''
      keep-runs:
        description: 'Custom API runs to keep on GitHub Pages (older ones are removed)'
        required: false
        type: number
        default: 10

permissions:
  contents: write
  packages: read

jobs:
  api-tests:
    uses: ./.github/workflows/playwright-run.yml
    secrets:
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    with:
      project: api
      family: custom-api
      paths: ${{ inputs.area != 'all' && format('tests/api/{0}/', inputs.area) || '' }}
      grep: ${{ inputs.grep }}
      # A manual run's number input arrives as a string; playwright-run.yml's keep-runs is a number.
      keep-runs: ${{ fromJSON(inputs.keep-runs) }}
