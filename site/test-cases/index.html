<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- One page for every scenario layer: scripts/build-test-cases.mts copies it to test-cases/<layer>/
       next to that layer's scenarios-data.js (window.SCENARIO_CATALOG). -->
  <title>SimpRight - Test Cases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070c;
      --surface: #0b1220;
      --surface-2: #101a2d;
      --surface-3: #152138;
      --line: rgba(148, 163, 184, 0.16);
      --line-bright: rgba(148, 163, 184, 0.32);
      --text: #edf2ff;
      --muted: #97a3b8;
      --teal: #2dd4bf;
      --teal-bg: rgba(45, 212, 191, 0.12);
      --cyan: #38bdf8;
      --cyan-bg: rgba(56, 189, 248, 0.12);
      --lime: #a3e635;
      --lime-bg: rgba(163, 230, 53, 0.12);
      --amber: #fbbf24;
      --amber-bg: rgba(251, 191, 36, 0.12);
      --rose: #fb7185;
      --rose-bg: rgba(251, 113, 133, 0.12);
      --purple: #c084fc;
      --purple-bg: rgba(192, 132, 252, 0.12);
      --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: 'IBM Plex Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        linear-gradient(180deg, rgba(8, 15, 26, 0.5), rgba(5, 7, 12, 0.96)),
        radial-gradient(circle at 12% 0%, rgba(45, 212, 191, 0.08), transparent 26%),
        radial-gradient(circle at 88% 8%, rgba(56, 189, 248, 0.08), transparent 26%),
        var(--bg);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* Layout */
    .app-layout {
      display: grid;
      grid-template-columns: 420px minmax(0, 1fr);
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar: header, filters, tree */
    .sidebar-pane {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 0;
      background: linear-gradient(180deg, rgba(11, 18, 32, 0.98), rgba(8, 13, 23, 0.94));
      border-right: 1px solid var(--line);
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1.1rem 1.25rem 0.85rem;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 26, 45, 0.45);
      flex-shrink: 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      color: var(--cyan);
      font-weight: 500;
      margin-bottom: 0.45rem;
    }
    .back-link:hover { color: #7dd3fc; }

    .brand-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .brand-tag {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: var(--teal-bg);
      border: 1px solid rgba(45, 212, 191, 0.25);
      color: var(--teal);
      white-space: nowrap;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }
    .layer-switch {
      display: flex;
      gap: 0.35rem;
    }
    .run-link {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--cyan);
      white-space: nowrap;
    }
    .run-link:hover { color: #7dd3fc; text-decoration: underline; }
    .layer-switch a {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .layer-switch a:hover { color: var(--text); border-color: var(--line-bright); }
    .layer-switch a.current { color: var(--cyan); border-color: rgba(56, 189, 248, 0.4); background: var(--cyan-bg); }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.45rem;
      margin-top: 0.8rem;
    }
    .kpi-card {
      background: rgba(21, 33, 56, 0.7);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.4rem 0.3rem;
      text-align: center;
      cursor: pointer;
      color: var(--text);
      transition: all 0.15s ease;
    }
    .kpi-card:hover { border-color: var(--line-bright); background: rgba(21, 33, 56, 0.95); }
    .kpi-card.active { border-color: var(--cyan); background: rgba(56, 189, 248, 0.14); }
    .kpi-card .num { display: block; font-size: 1.12rem; font-weight: 700; line-height: 1.1; }
    .kpi-card .lbl {
      display: block;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-top: 0.15rem;
    }
    .num-auto { color: var(--lime); }
    .num-manual { color: var(--rose); }
    .num-known { color: var(--amber); }

    .filter-box {
      padding: 0.75rem 1.25rem 0.65rem;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 26, 45, 0.2);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .search-input-wrap { position: relative; }
    .search-input {
      width: 100%;
      background: rgba(16, 26, 45, 0.85);
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.86rem;
      padding: 0.48rem 2rem 0.48rem 2.2rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15); }
    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .clear-search-btn {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0.1rem 0.3rem;
    }
    .clear-search-btn:hover { color: var(--text); }

    .filter-pills-row {
      display: flex;
      gap: 0.35rem;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .filter-pills-container { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .filter-pill {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.15s ease;
    }
    .filter-pill:hover { color: var(--text); border-color: var(--line-bright); }
    .filter-pill.active { background: var(--cyan-bg); border-color: rgba(56, 189, 248, 0.4); color: var(--cyan); }
    .filter-pill.active[data-status="automated"] { background: var(--lime-bg); border-color: rgba(163, 230, 53, 0.4); color: var(--lime); }
    .filter-pill.active[data-status="manual"] { background: var(--rose-bg); border-color: rgba(251, 113, 133, 0.4); color: var(--rose); }
    .filter-pill.active[data-status="known"] { background: var(--amber-bg); border-color: rgba(251, 191, 36, 0.4); color: var(--amber); }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* Tree */
    .scenarios-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.4rem 0.85rem 0.8rem;
    }
    .scenarios-list::-webkit-scrollbar { width: 6px; }
    .scenarios-list::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 3px; }

    .tree-root-label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      padding: 0.6rem 0.35rem 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tree-root-label .label-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-action {
      padding: 0.12rem 0.45rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 0.66rem;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .tree-action:hover { color: var(--cyan); border-color: rgba(56, 189, 248, 0.4); }
    .tree-group.collapsed > .tree-children { display: none; }
    .tree-label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      width: 100%;
      padding: 0.38rem 0.35rem;
      border: none;
      border-radius: 6px;
      background: none;
      cursor: pointer;
      text-align: left;
      color: var(--cyan);
      transition: background 0.15s ease;
    }
    .tree-label:hover { background: rgba(56, 189, 248, 0.1); }
    .tree-label.area { font-size: 0.85rem; font-weight: 700; }
    .tree-label.file { font-size: 0.8rem; font-weight: 500; color: #7dd3fc; padding-left: 1.2rem; }
    .tree-label .label-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-label.file .label-text.endpoint { font-family: var(--mono); font-size: 0.76rem; }
    .tree-count {
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0.05rem 0.4rem;
      border-radius: 999px;
      border: 1px solid var(--line);
    }
    .tree-toggle {
      display: inline-flex;
      width: 16px;
      height: 16px;
      color: var(--muted);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .tree-group.collapsed > .tree-label .tree-toggle { transform: rotate(-90deg); }

    .tree-leaf {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
      width: 100%;
      padding: 0.42rem 0.35rem 0.42rem 2.55rem;
      border: none;
      border-radius: 6px;
      background: none;
      cursor: pointer;
      text-align: left;
      font-size: 0.8rem;
      color: var(--text);
      position: relative;
    }
    .tree-leaf:hover { background: rgba(21, 33, 56, 0.6); }
    .tree-leaf.active { background: rgba(56, 189, 248, 0.15); color: var(--cyan); }
    .tree-leaf.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--cyan);
    }
    .tree-leaf .status-dot { align-self: center; }
    .tree-leaf .status-dot.automated { color: var(--lime); }
    .tree-leaf .status-dot.manual { color: var(--rose); }
    .tree-leaf .leaf-id { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }
    .tree-leaf.active .leaf-id { color: var(--cyan); }
    .tree-leaf .leaf-name { flex: 1; min-width: 0; line-height: 1.35; }
    .tree-leaf .leaf-known { color: var(--amber); font-size: 0.72rem; flex-shrink: 0; }

    .list-empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); font-size: 0.88rem; }

    .list-footer {
      padding: 0.5rem 1.25rem;
      border-top: 1px solid var(--line);
      background: rgba(16, 26, 45, 0.3);
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .list-footer code { font-family: var(--mono); }

    /* Detail pane */
    .detail-pane {
      height: 100vh;
      overflow-y: auto;
      min-width: 0;
    }
    .detail-pane::-webkit-scrollbar { width: 8px; }
    .detail-pane::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 4px; }

    .detail-header {
      padding: 1.5rem 2rem 1.2rem;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(16, 26, 45, 0.8), rgba(11, 18, 32, 0.4));
    }
    .detail-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }
    .detail-breadcrumbs .sep { color: rgba(148, 163, 184, 0.4); }
    .detail-breadcrumbs strong { color: var(--text); font-weight: 600; }
    .detail-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.25rem;
      margin-bottom: 0.85rem;
    }
    .detail-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin: 0;
    }
    .header-actions { display: flex; gap: 0.45rem; flex-shrink: 0; flex-wrap: wrap; }

    .btn-action {
      background: rgba(16, 26, 45, 0.8);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .btn-action:hover { background: rgba(21, 33, 56, 1); border-color: var(--cyan); color: var(--cyan); }
    .btn-action.copied { background: var(--teal-bg); border-color: var(--teal); color: var(--teal); }
    .btn-action.active {
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.25), rgba(56, 189, 248, 0.3));
      border-color: var(--cyan);
      color: #fff;
    }

    .meta-tags-row { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
    .chip {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .chip.id { font-family: var(--mono); color: var(--text); border-radius: 6px; }
    .chip.automated { color: #bef264; background: var(--lime-bg); border-color: rgba(163, 230, 53, 0.3); }
    .chip.manual { color: #fda4af; background: var(--rose-bg); border-color: rgba(251, 113, 133, 0.3); }
    .chip.known { color: #fcd34d; background: var(--amber-bg); border-color: rgba(251, 191, 36, 0.3); }
    .chip.role { color: #d8b4fe; background: var(--purple-bg); border-color: rgba(192, 132, 252, 0.3); }
    .chip.tag { font-family: var(--mono); color: #7dd3fc; background: rgba(56, 189, 248, 0.07); border-color: rgba(56, 189, 248, 0.16); border-radius: 4px; }

    .banner {
      margin: 1.25rem 2rem 0;
      padding: 0.95rem 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .banner.auto { background: linear-gradient(90deg, rgba(163, 230, 53, 0.08), rgba(16, 26, 45, 0.5)); border-color: rgba(163, 230, 53, 0.3); }
    .banner.manual { background: linear-gradient(90deg, rgba(251, 113, 133, 0.08), rgba(16, 26, 45, 0.5)); border-color: rgba(251, 113, 133, 0.3); }
    .banner.known { background: linear-gradient(90deg, rgba(251, 191, 36, 0.1), rgba(16, 26, 45, 0.5)); border-color: rgba(251, 191, 36, 0.3); }
    .banner.refs { background: rgba(16, 26, 45, 0.5); }
    .banner-left { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    .banner-title { font-size: 0.88rem; font-weight: 700; display: flex; align-items: center; gap: 0.45rem; }
    .banner.auto .banner-title { color: var(--lime); }
    .banner.manual .banner-title { color: var(--rose); }
    .banner.known .banner-title { color: var(--amber); }
    .banner.refs .banner-title { color: var(--text); }
    .banner-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
    .banner-desc a { color: #7dd3fc; }
    .banner-desc a:hover { text-decoration: underline; }
    .banner-actions { display: flex; gap: 0.45rem; flex-wrap: wrap; }
    .code {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: #7dd3fc;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .detail-tabs-bar {
      margin: 1.25rem 2rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.5rem;
    }
    .detail-tab {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .detail-tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .detail-tab.active { color: var(--cyan); background: var(--cyan-bg); }
    .detail-tabs-bar .btn-action { margin-left: auto; }

    .detail-content-area { padding: 1.25rem 2rem 2.5rem; }

    .steps-container { display: flex; flex-direction: column; gap: 0.6rem; }
    .step-card {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      background: rgba(16, 26, 45, 0.55);
      border: 1px solid var(--line);
    }
    .step-card:hover { background: rgba(21, 33, 56, 0.8); border-color: rgba(56, 189, 248, 0.25); }
    .step-card.verify { border-left: 2px solid rgba(163, 230, 53, 0.45); }
    .step-number {
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 700;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.22);
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-text { font-size: 0.92rem; line-height: 1.55; flex: 1; min-width: 0; overflow-wrap: anywhere; padding-top: 0.15rem; }
    .step-kw-action { color: var(--cyan); font-weight: 600; }
    .step-kw-verify { color: var(--lime); font-weight: 600; }
    .step-token-quote {
      color: #fef08a;
      background: rgba(254, 240, 138, 0.08);
      padding: 0.05rem 0.3rem;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.85em;
      border: 1px solid rgba(254, 240, 138, 0.2);
    }
    .step-token-endpoint { color: #93c5fd; font-family: var(--mono); font-size: 0.88em; }

    .step-check {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      margin: 0.3rem 0 0;
      border: 1.5px solid var(--muted);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.4);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .step-check:hover { border-color: var(--cyan); }
    .step-check:checked { background: var(--teal); border-color: var(--teal); }
    .step-check:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1px;
      width: 5px;
      height: 10px;
      border: solid #05070c;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .step-card.done .step-text { text-decoration: line-through; opacity: 0.6; }

    .yaml-container {
      background: #080d17;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem;
      overflow-x: auto;
    }
    .yaml-pre { margin: 0; font-family: var(--mono); font-size: 0.84rem; line-height: 1.6; color: #cbd5e1; white-space: pre; }
    .yaml-key { color: #7dd3fc; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--muted);
    }
    .empty-state svg { width: 64px; height: 64px; stroke: rgba(148, 163, 184, 0.35); margin-bottom: 1.25rem; }
    .empty-state h3 { font-size: 1.15rem; color: var(--text); margin: 0 0 0.5rem; }
    .empty-state p { font-size: 0.88rem; max-width: 440px; line-height: 1.5; margin: 0; }

    @media (max-width: 1100px) {
      .app-layout { display: flex; flex-direction: column; height: auto; overflow: visible; }
      .sidebar-pane { height: auto; border-right: none; border-bottom: 1px solid var(--line); }
      .scenarios-list { max-height: 420px; }
      .detail-pane { height: auto; overflow: visible; }
      .empty-state { min-height: 260px; }
    }

    @media (max-width: 640px) {
      .sidebar-header, .filter-box, .list-footer { padding-left: 16px; padding-right: 16px; }
      .scenarios-list { padding-left: 8px; padding-right: 8px; }
      .detail-header { padding: 1.1rem 16px 1rem; }
      .banner, .detail-tabs-bar { margin-left: 16px; margin-right: 16px; }
      .detail-content-area { padding: 1rem 16px 2rem; }
      .detail-title-row { flex-direction: column; gap: 0.75rem; }
      .detail-title { font-size: 1.2rem; }
      .kpi-card .lbl { font-size: 0.56rem; }
      .step-card { gap: 0.7rem; padding: 0.75rem 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar-pane">
      <div class="sidebar-header">
        <a href="../../index.html" class="back-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Automation Portal
        </a>
        <div class="brand-title">
          <h1 id="page-title">Test Cases</h1>
          <span class="brand-tag">Scenario catalog</span>
        </div>
        <div class="header-row">
          <nav class="layer-switch" aria-label="Test case pages">
            <a href="../ui/" data-layer="ui">UI</a>
            <a href="../api/" data-layer="api">API</a>
          </nav>
          <a class="run-link" id="run-link" target="_blank" rel="noreferrer" title="Open the custom test run workflow in GitHub Actions" hidden>Run on GitHub ↗</a>
        </div>
        <div class="kpi-row">
          <button type="button" class="kpi-card" data-status="all" title="Show all scenarios">
            <span class="num" id="kpi-total">-</span><span class="lbl">Total</span>
          </button>
          <button type="button" class="kpi-card" data-status="automated" title="Show automated scenarios">
            <span class="num num-auto" id="kpi-auto">-</span><span class="lbl" id="kpi-auto-lbl">Automated</span>
          </button>
          <button type="button" class="kpi-card" data-status="manual" title="Show manual scenarios">
            <span class="num num-manual" id="kpi-manual">-</span><span class="lbl">Manual</span>
          </button>
          <button type="button" class="kpi-card" data-status="known" title="Show scenarios with a known issue">
            <span class="num num-known" id="kpi-known">-</span><span class="lbl">Known issues</span>
          </button>
        </div>
      </div>

      <div class="filter-box">
        <div class="search-input-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="scenario-search" class="search-input" placeholder="Search ID, name, steps, role..." autocomplete="off" aria-label="Search scenarios">
          <button type="button" id="clear-search" class="clear-search-btn" title="Clear search" hidden>✕</button>
        </div>
        <div class="filter-pills-row">
          <div class="filter-pills-container" role="group" aria-label="Filter by status">
            <button type="button" class="filter-pill active" data-status="all">All</button>
            <button type="button" class="filter-pill" data-status="automated"><span class="status-dot" style="color: var(--lime)"></span>Automated</button>
            <button type="button" class="filter-pill" data-status="manual"><span class="status-dot" style="color: var(--rose)"></span>Manual</button>
            <button type="button" class="filter-pill" data-status="known"><span class="status-dot" style="color: var(--amber)"></span>Known issue</button>
          </div>
        </div>
      </div>

      <div class="scenarios-list" id="scenarios-list"></div>

      <div class="list-footer">
        <span id="showing-count">Loading scenarios...</span>
        <span id="generated-info"></span>
      </div>
    </aside>

    <main class="detail-pane" id="detail-pane">
      <div id="empty-state" class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.5L19 7.5V19a2 2 0 0 1-2 2z"/>
        </svg>
        <h3 id="empty-title">No scenario selected</h3>
        <p id="empty-text">Pick a scenario in the tree to see its steps, automation status and YAML.</p>
      </div>

      <div id="scenario-detail" hidden>
        <header class="detail-header">
          <div class="detail-breadcrumbs" id="detail-breadcrumbs"></div>
          <div class="detail-title-row">
            <h2 class="detail-title" id="detail-title"></h2>
            <div class="header-actions">
              <button type="button" class="btn-action" id="btn-copy-link" data-label="Copy link">Copy link</button>
              <button type="button" class="btn-action" id="btn-copy-yaml" data-label="Copy YAML">Copy YAML</button>
            </div>
          </div>
          <div class="meta-tags-row" id="detail-chips"></div>
        </header>

        <div id="detail-banners"></div>

        <div class="detail-tabs-bar">
          <button type="button" class="detail-tab active" data-tab="steps">Steps (<span id="steps-count">0</span>)</button>
          <button type="button" class="detail-tab" data-tab="yaml">YAML</button>
          <button type="button" class="btn-action" id="btn-execute" title="Tick off the steps while running the scenario by hand">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Execute
          </button>
        </div>

        <div class="detail-content-area">
          <div id="tab-steps" class="steps-container"></div>
          <div id="tab-yaml" class="yaml-container" hidden><pre class="yaml-pre" id="yaml-content"></pre></div>
        </div>
      </div>
    </main>
  </div>

  <script src="scenarios-data.js"></script>
  <script>
    (function () {
      const catalog = window.SCENARIO_CATALOG;
      const $ = (id) => document.getElementById(id);
      const CHEVRON = '<span class="tree-toggle" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></span>';

      const state = {
        selectedId: null,
        tab: 'steps',
        search: '',
        status: 'all',
        // Open tree groups ("area:<name>" or "file:<path>"). Everything starts collapsed; selecting a
        // scenario (or a #scenario= link) opens its branch, and filtering opens every matching group.
        open: new Set(),
        executing: new Set(),
        done: new Map(),
      };

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function blobUrl(file, line) {
        const [filePath, anchor] = file.split('#');
        return `${catalog.repoUrl}/blob/${catalog.branch}/${filePath}${line ? `#L${line}` : anchor ? `#${anchor.toLowerCase()}` : ''}`;
      }

      function init() {
        if (!catalog) {
          $('showing-count').textContent = 'No scenario data found.';
          $('empty-title').textContent = 'No scenario data';
          $('empty-text').textContent = 'scenarios-data.js is missing. Build it with npm run test-cases:build.';
          return;
        }
        document.title = `SimpRight - ${catalog.title}`;
        $('page-title').textContent = catalog.title;
        document.querySelectorAll('.layer-switch a').forEach((a) => a.classList.toggle('current', a.dataset.layer === catalog.layer));

        const { stats } = catalog;
        $('kpi-total').textContent = stats.total;
        $('kpi-auto').textContent = stats.automated;
        $('kpi-auto-lbl').textContent = `Automated ${stats.automatedPct}%`;
        $('kpi-manual').textContent = stats.manual;
        $('kpi-known').textContent = stats.knownIssues;

        if (catalog.workflowUrl) {
          $('run-link').href = catalog.workflowUrl;
          $('run-link').hidden = false;
        }
        const updated = new Date(catalog.generatedAt);
        const commit = catalog.commit ? catalog.commit.slice(0, 7) : '';
        $('generated-info').innerHTML = `Updated ${escapeHtml(updated.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }))}` +
          (commit ? ` · <a href="${escapeHtml(`${catalog.repoUrl}/commit/${catalog.commit}`)}" target="_blank" rel="noreferrer"><code>${escapeHtml(commit)}</code></a>` : '');

        bindEvents();
        readHash();
        render();
      }

      function bindEvents() {
        $('scenario-search').addEventListener('input', (e) => {
          state.search = e.target.value.trim().toLowerCase();
          $('clear-search').hidden = !state.search;
          if (isFiltering()) expandAll();
          render();
        });
        $('clear-search').addEventListener('click', () => {
          $('scenario-search').value = '';
          state.search = '';
          $('clear-search').hidden = true;
          $('scenario-search').focus();
          render();
        });
        document.querySelectorAll('[data-status]').forEach((button) => {
          button.addEventListener('click', () => setStatus(button.dataset.status));
        });
        document.querySelectorAll('.detail-tab').forEach((tab) => {
          tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });
        $('btn-copy-yaml').addEventListener('click', (e) => copy(e.currentTarget, selected()?.yaml ?? ''));
        $('btn-copy-link').addEventListener('click', (e) => copy(e.currentTarget, location.href));
        $('btn-execute').addEventListener('click', () => {
          const id = state.selectedId;
          if (!id) return;
          if (state.executing.has(id)) {
            state.executing.delete(id);
            state.done.delete(id);
          } else {
            state.executing.add(id);
          }
          renderSteps(selected());
        });
        window.addEventListener('hashchange', () => {
          readHash();
          render();
        });
        document.addEventListener('keydown', (e) => {
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            move(e.key === 'ArrowDown' ? 1 : -1);
          }
        });
      }

      function setStatus(status) {
        state.status = status;
        document.querySelectorAll('[data-status]').forEach((b) => b.classList.toggle('active', b.dataset.status === status && (b.classList.contains('filter-pill') || status !== 'all')));
        if (isFiltering()) expandAll();
        render();
      }

      function isFiltering() {
        return Boolean(state.search) || state.status !== 'all';
      }

      function branchKeys(sc) {
        return [`area:${sc.area}`, `file:${sc.file}`];
      }

      // Opens every group; the tree renders only the groups with shown scenarios.
      function expandAll() {
        for (const area of catalog.tree) {
          state.open.add(`area:${area.area}`);
          for (const file of area.files) state.open.add(`file:${file.file}`);
        }
      }

      function collapseAll() {
        state.open.clear();
      }

      function matches(sc) {
        if (state.status === 'known' && !sc.knownIssue) return false;
        if ((state.status === 'automated' || state.status === 'manual') && sc.status !== state.status) return false;
        if (!state.search) return true;
        const text = [sc.id, sc.name, sc.suite, sc.areaLabel, sc.fileLabel, sc.file, sc.role ?? '', sc.knownIssue ?? '', sc.automatedIn ?? '', ...sc.ref, ...sc.tags, ...sc.steps]
          .join(' ')
          .toLowerCase();
        return text.includes(state.search);
      }

      function visible() {
        return catalog.scenarios.filter(matches);
      }

      function selected() {
        return catalog.scenarios.find((s) => s.id === state.selectedId);
      }

      function render() {
        const shown = visible();
        const shownIds = new Set(shown.map((s) => s.id));
        if (!shownIds.has(state.selectedId)) state.selectedId = shown[0]?.id ?? null;
        renderTree(shownIds);
        $('showing-count').textContent = `Showing ${shown.length} of ${catalog.scenarios.length} scenarios`;
        const sc = selected();
        if (sc) renderDetail(sc);
        else showEmpty(shown.length === 0 && catalog.scenarios.length > 0);
      }

      function renderTree(shownIds) {
        const list = $('scenarios-list');
        list.innerHTML = '';
        const byId = new Map(catalog.scenarios.map((s) => [s.id, s]));
        const fragment = document.createDocumentFragment();

        const root = document.createElement('div');
        root.className = 'tree-root-label';
        const title = document.createElement('span');
        title.className = 'label-text';
        title.textContent = catalog.title;
        root.append(title, treeAction('Expand all', expandAll), treeAction('Collapse all', collapseAll));
        fragment.appendChild(root);

        let any = false;
        for (const area of catalog.tree) {
          const files = area.files
            .map((file) => ({ file, ids: file.ids.filter((id) => shownIds.has(id)) }))
            .filter((f) => f.ids.length > 0);
          if (files.length === 0) continue;
          any = true;

          const areaKey = `area:${area.area}`;
          const areaGroup = group(areaKey, 'area', escapeHtml(area.label), files.reduce((n, f) => n + f.ids.length, 0));
          for (const { file, ids } of files) {
            const fileKey = `file:${file.file}`;
            const labelClass = catalog.layer === 'api' && file.label !== file.name ? 'label-text endpoint' : 'label-text';
            const fileGroup = group(fileKey, 'file', escapeHtml(file.label), ids.length, labelClass, file.file);
            for (const id of ids) fileGroup.children.appendChild(leaf(byId.get(id)));
            areaGroup.children.appendChild(fileGroup.el);
          }
          fragment.appendChild(areaGroup.el);
        }

        if (!any) {
          const empty = document.createElement('div');
          empty.className = 'list-empty';
          empty.textContent = catalog.scenarios.length ? 'No scenarios match the filters.' : 'No scenarios yet.';
          fragment.appendChild(empty);
        }
        list.appendChild(fragment);
      }

      function treeAction(text, action) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'tree-action';
        button.textContent = text;
        button.addEventListener('click', () => {
          action();
          renderTree(new Set(visible().map((s) => s.id)));
        });
        return button;
      }

      function group(key, kind, labelHtml, count, labelClass = 'label-text', title = '') {
        const open = state.open.has(key);
        const el = document.createElement('div');
        el.className = `tree-group${open ? '' : ' collapsed'}`;
        const label = document.createElement('button');
        label.type = 'button';
        label.className = `tree-label ${kind}`;
        label.setAttribute('aria-expanded', String(open));
        if (title) label.title = title;
        label.innerHTML = `${CHEVRON}<span class="${labelClass}">${labelHtml}</span><span class="tree-count">${count}</span>`;
        label.addEventListener('click', () => {
          const nowOpen = el.classList.toggle('collapsed') === false;
          label.setAttribute('aria-expanded', String(nowOpen));
          nowOpen ? state.open.add(key) : state.open.delete(key);
        });
        const children = document.createElement('div');
        children.className = 'tree-children';
        el.append(label, children);
        return { el, children };
      }

      function leaf(sc) {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = `tree-leaf${sc.id === state.selectedId ? ' active' : ''}`;
        item.dataset.id = sc.id;
        item.title = `${sc.id}: ${sc.name}`;
        item.innerHTML =
          `<span class="status-dot ${sc.status}" title="${sc.status}"></span>` +
          `<span class="leaf-id">${escapeHtml(sc.id)}</span>` +
          `<span class="leaf-name">${escapeHtml(sc.name)}</span>` +
          (sc.knownIssue ? '<span class="leaf-known" title="Known issue">⚠</span>' : '');
        item.addEventListener('click', () => select(sc.id));
        return item;
      }

      function select(id) {
        if (state.selectedId === id && location.hash === `#scenario=${encodeURIComponent(id)}`) return;
        state.selectedId = id;
        const sc = selected();
        // Arrow keys can move into a collapsed group: open the branch so the selection stays in view.
        const closed = sc ? branchKeys(sc).filter((key) => !state.open.has(key)) : [];
        closed.forEach((key) => state.open.add(key));
        history.replaceState(null, '', `#scenario=${encodeURIComponent(id)}`);
        document.querySelectorAll('.tree-leaf').forEach((item) => item.classList.toggle('active', item.dataset.id === id));
        if (sc) renderDetail(sc);
        if (closed.length || !document.querySelector('.tree-leaf.active')) render();
        document.querySelector('.tree-leaf.active')?.scrollIntoView({ block: 'nearest' });
      }

      function move(direction) {
        const shown = visible();
        if (shown.length === 0) return;
        // Tree order: areas, then files, then scenarios, the same order as catalog.scenarios.
        const index = shown.findIndex((s) => s.id === state.selectedId);
        const next = shown[Math.min(Math.max(index + direction, 0), shown.length - 1)];
        select(next.id);
      }

      function readHash() {
        const params = new URLSearchParams(location.hash.slice(1));
        const id = params.get('scenario');
        if (id && catalog.scenarios.some((s) => s.id === id)) {
          state.selectedId = id;
          branchKeys(selected()).forEach((key) => state.open.add(key));
        }
      }

      function showEmpty(filteredOut) {
        $('empty-state').hidden = false;
        $('scenario-detail').hidden = true;
        $('empty-title').textContent = filteredOut ? 'Nothing matches' : 'No scenario selected';
        $('empty-text').textContent = filteredOut
          ? 'No scenario matches the search and filters. Clear them to see the whole catalog.'
          : 'Pick a scenario in the tree to see its steps, automation status and YAML.';
      }

      function renderDetail(sc) {
        $('empty-state').hidden = true;
        $('scenario-detail').hidden = false;

        $('detail-breadcrumbs').innerHTML =
          `<span>${escapeHtml(catalog.title)}</span><span class="sep">/</span>` +
          `<span>${escapeHtml(sc.areaLabel)}</span><span class="sep">/</span>` +
          `<strong>${escapeHtml(sc.fileLabel)}</strong>`;
        $('detail-title').textContent = sc.name;

        let chips = `<span class="chip id">${escapeHtml(sc.id)}</span>`;
        chips += sc.status === 'automated'
          ? '<span class="chip automated"><span class="status-dot"></span>Automated</span>'
          : '<span class="chip manual"><span class="status-dot"></span>Manual</span>';
        if (sc.knownIssue) chips += '<span class="chip known">⚠ Known issue</span>';
        chips += `<span class="chip role" title="Who runs the scenario">Role: ${escapeHtml(sc.role ?? 'default')}</span>`;
        chips += sc.tags.map((t) => `<span class="chip tag">${escapeHtml(t)}</span>`).join('');
        $('detail-chips').innerHTML = chips;

        renderBanners(sc);
        $('steps-count').textContent = sc.steps.length;
        renderSteps(sc);
        $('yaml-content').innerHTML = escapeHtml(sc.yaml).replace(/^(\s*-?\s*)([A-Za-z]+):/gm, '$1<span class="yaml-key">$2</span>:');
        switchTab(state.tab);
      }

      function renderBanners(sc) {
        const banners = $('detail-banners');
        banners.innerHTML = '';
        const command = `npx playwright test -g "${sc.id}:"`;

        if (sc.status === 'automated') {
          const specLink = `<a href="${escapeHtml(blobUrl(sc.automatedIn, sc.specLine))}" target="_blank" rel="noreferrer"><span class="code">${escapeHtml(sc.automatedIn)}${sc.specLine ? `:${sc.specLine}` : ''}</span></a>`;
          // GitHub can't pre-fill a manual workflow's inputs from a link, so Run on GitHub copies the title filter.
          const filter = `${sc.id}:`;
          const runHint = catalog.workflowUrl
            ? `<br>Run on GitHub copies <span class="code">${escapeHtml(filter)}</span>: choose the area <strong>${escapeHtml(sc.area)}</strong> and paste it as the title filter (grep).`
            : '';
          const actions = [['Copy command', () => command]];
          if (catalog.workflowUrl) actions.push(['Run on GitHub ↗', () => filter, catalog.workflowUrl]);
          banners.appendChild(banner('auto', 'Automated',
            `Spec: ${specLink}<br>Run it locally: <span class="code">${escapeHtml(command)}</span>${runHint}`,
            actions));
        } else {
          const skill = catalog.layer === 'api' ? '/implement-api-scenarios' : '/implement-ui-scenarios';
          banners.appendChild(banner('manual', 'Manual',
            `Not automated yet. Run it by hand with <strong>Execute</strong> below, or automate it with <span class="code">${escapeHtml(`${skill} ${sc.id}`)}</span>.`,
            []));
        }

        if (sc.knownIssue) {
          banners.appendChild(banner('known', 'Known issue',
            `${escapeHtml(sc.knownIssue)}<br>The test is expected to fail until the app is fixed (<span class="code">test.fail</span>).`,
            []));
        }

        const fileLink = `<a href="${escapeHtml(blobUrl(sc.file))}" target="_blank" rel="noreferrer"><span class="code">${escapeHtml(sc.file)}</span></a>`;
        const refs = sc.ref.map((ref) =>
          ref.startsWith('docs/')
            ? `<a href="${escapeHtml(blobUrl(ref))}" target="_blank" rel="noreferrer"><span class="code">${escapeHtml(ref)}</span></a>`
            : `<span class="code">${escapeHtml(ref)}</span>`);
        banners.appendChild(banner('refs', 'Source',
          `Scenario file: ${fileLink}` + (refs.length ? `<br>Comes from: ${refs.join(' ')}` : ''),
          []));
      }

      function banner(kind, title, descHtml, actions) {
        const el = document.createElement('div');
        el.className = `banner ${kind}`;
        el.innerHTML = `<div class="banner-left"><div class="banner-title">${escapeHtml(title)}</div><div class="banner-desc">${descHtml}</div></div>`;
        if (actions.length) {
          const box = document.createElement('div');
          box.className = 'banner-actions';
          // Each action copies text() to the clipboard and, when it has a URL, opens it in a new tab.
          for (const [label, text, url] of actions) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'btn-action';
            button.dataset.label = label;
            button.textContent = label;
            button.addEventListener('click', () => {
              copy(button, text());
              if (url) window.open(url, '_blank', 'noopener');
            });
            box.appendChild(button);
          }
          el.appendChild(box);
        }
        return el;
      }

      function formatStep(raw) {
        let text = escapeHtml(raw);
        text = text.replace(/&quot;(.*?)&quot;/g, '<span class="step-token-quote">&quot;$1&quot;</span>');
        text = text.replace(/\b(GET|POST|PUT|PATCH|DELETE|QUERY) (\/[^\s,;:)]*[^\s,.;:)])/g, '<span class="step-token-endpoint">$1 $2</span>');
        text = text.replace(/^(Verify)\b/, '<span class="step-kw-verify">$1</span>');
        text = text.replace(/^(Open|Click|Select|Enter|Set|Search|Send|Create|Add|Remove|Log in|Register|Type|Check|Clear|Pick|Go to)\b/, '<span class="step-kw-action">$1</span>');
        return text;
      }

      function renderSteps(sc) {
        const container = $('tab-steps');
        container.innerHTML = '';
        const executing = state.executing.has(sc.id);
        $('btn-execute').classList.toggle('active', executing);
        if (!state.done.has(sc.id)) state.done.set(sc.id, new Set());
        const done = state.done.get(sc.id);

        sc.steps.forEach((step, index) => {
          const card = document.createElement('div');
          card.className = `step-card${/^Verify\b/.test(step) ? ' verify' : ''}${executing && done.has(index) ? ' done' : ''}`;
          if (executing) {
            const check = document.createElement('input');
            check.type = 'checkbox';
            check.className = 'step-check';
            check.checked = done.has(index);
            check.setAttribute('aria-label', `Step ${index + 1} done`);
            check.addEventListener('change', () => {
              check.checked ? done.add(index) : done.delete(index);
              card.classList.toggle('done', check.checked);
            });
            card.appendChild(check);
          }
          card.insertAdjacentHTML('beforeend', `<div class="step-number">${index + 1}</div><div class="step-text">${formatStep(step)}</div>`);
          container.appendChild(card);
        });
      }

      function switchTab(tab) {
        state.tab = tab;
        document.querySelectorAll('.detail-tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === tab));
        $('tab-steps').hidden = tab !== 'steps';
        $('tab-yaml').hidden = tab !== 'yaml';
        $('btn-execute').hidden = tab !== 'steps';
      }

      function copy(button, text) {
        const done = () => {
          button.classList.add('copied');
          button.textContent = 'Copied';
          setTimeout(() => {
            button.classList.remove('copied');
            button.textContent = button.dataset.label;
          }, 1500);
        };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => {});
      }

      init();
    })();
  </script>
</body>
</html>
