<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The Bugs page: scripts/build-bugs.mts copies it to bugs/ next to bugs-data.js (window.BUG_CATALOG).
       It reads the latest regression results itself to flag bugs whose tests started passing. -->
  <title>SimpRight - Bugs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070c;
      --surface: #0b1220;
      --surface-2: #101a2d;
      --surface-3: #152138;
      --line: rgba(148, 163, 184, 0.16);
      --line-bright: rgba(148, 163, 184, 0.32);
      --text: #edf2ff;
      --muted: #97a3b8;
      --teal: #2dd4bf;
      --teal-bg: rgba(45, 212, 191, 0.12);
      --cyan: #38bdf8;
      --cyan-bg: rgba(56, 189, 248, 0.12);
      --lime: #a3e635;
      --lime-bg: rgba(163, 230, 53, 0.12);
      --amber: #fbbf24;
      --amber-bg: rgba(251, 191, 36, 0.12);
      --rose: #fb7185;
      --rose-bg: rgba(251, 113, 133, 0.12);
      --purple: #c084fc;
      --purple-bg: rgba(192, 132, 252, 0.12);
      --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: 'IBM Plex Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        linear-gradient(180deg, rgba(8, 15, 26, 0.5), rgba(5, 7, 12, 0.96)),
        radial-gradient(circle at 12% 0%, rgba(45, 212, 191, 0.08), transparent 26%),
        radial-gradient(circle at 88% 8%, rgba(56, 189, 248, 0.08), transparent 26%),
        var(--bg);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* Layout */
    .app-layout {
      display: grid;
      grid-template-columns: 420px minmax(0, 1fr);
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar: header, filters, tree */
    .sidebar-pane {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 0;
      background: linear-gradient(180deg, rgba(11, 18, 32, 0.98), rgba(8, 13, 23, 0.94));
      border-right: 1px solid var(--line);
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1.1rem 1.25rem 0.85rem;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 26, 45, 0.45);
      flex-shrink: 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      color: var(--cyan);
      font-weight: 500;
      margin-bottom: 0.45rem;
    }
    .back-link:hover { color: #7dd3fc; }

    .brand-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .brand-tag {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: var(--teal-bg);
      border: 1px solid rgba(45, 212, 191, 0.25);
      color: var(--teal);
      white-space: nowrap;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.45rem;
      margin-top: 0.8rem;
    }
    .kpi-card {
      background: rgba(21, 33, 56, 0.7);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.4rem 0.3rem;
      text-align: center;
      cursor: pointer;
      color: var(--text);
      transition: all 0.15s ease;
    }
    .kpi-card:hover { border-color: var(--line-bright); background: rgba(21, 33, 56, 0.95); }
    .kpi-card.active { border-color: var(--cyan); background: rgba(56, 189, 248, 0.14); }
    .kpi-card .num { display: block; font-size: 1.12rem; font-weight: 700; line-height: 1.1; }
    .kpi-card .lbl {
      display: block;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-top: 0.15rem;
    }
    .num-auto { color: var(--lime); }
    .num-manual { color: var(--rose); }
    .num-known { color: var(--amber); }

    .filter-box {
      padding: 0.75rem 1.25rem 0.65rem;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 26, 45, 0.2);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .search-input-wrap { position: relative; }
    .search-input {
      width: 100%;
      background: rgba(16, 26, 45, 0.85);
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.86rem;
      padding: 0.48rem 2rem 0.48rem 2.2rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15); }
    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .clear-search-btn {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0.1rem 0.3rem;
    }
    .clear-search-btn:hover { color: var(--text); }

    .filter-pills-row {
      display: flex;
      gap: 0.35rem;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .filter-pills-container { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .filter-pill {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.15s ease;
    }
    .filter-pill:hover { color: var(--text); border-color: var(--line-bright); }
    .filter-pill.active { background: var(--cyan-bg); border-color: rgba(56, 189, 248, 0.4); color: var(--cyan); }
    .filter-pill.active[data-status="automated"] { background: var(--lime-bg); border-color: rgba(163, 230, 53, 0.4); color: var(--lime); }
    .filter-pill.active[data-status="manual"] { background: var(--rose-bg); border-color: rgba(251, 113, 133, 0.4); color: var(--rose); }
    .filter-pill.active[data-status="known"] { background: var(--amber-bg); border-color: rgba(251, 191, 36, 0.4); color: var(--amber); }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* Tree */
    .scenarios-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.4rem 0.85rem 0.8rem;
    }
    .scenarios-list::-webkit-scrollbar { width: 6px; }
    .scenarios-list::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 3px; }

    .tree-root-label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      padding: 0.6rem 0.35rem 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tree-root-label .label-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-action {
      padding: 0.12rem 0.45rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 0.66rem;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .tree-action:hover { color: var(--cyan); border-color: rgba(56, 189, 248, 0.4); }
    .tree-group.collapsed > .tree-children { display: none; }
    .tree-label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      width: 100%;
      padding: 0.38rem 0.35rem;
      border: none;
      border-radius: 6px;
      background: none;
      cursor: pointer;
      text-align: left;
      color: var(--cyan);
      transition: background 0.15s ease;
    }
    .tree-label:hover { background: rgba(56, 189, 248, 0.1); }
    .tree-label.area { font-size: 0.85rem; font-weight: 700; }
    .tree-label.file { font-size: 0.8rem; font-weight: 500; color: #7dd3fc; padding-left: 1.2rem; }
    .tree-label .label-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-label.file .label-text.endpoint { font-family: var(--mono); font-size: 0.76rem; }
    .tree-count {
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0.05rem 0.4rem;
      border-radius: 999px;
      border: 1px solid var(--line);
    }
    .tree-toggle {
      display: inline-flex;
      width: 16px;
      height: 16px;
      color: var(--muted);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .tree-group.collapsed > .tree-label .tree-toggle { transform: rotate(-90deg); }

    .tree-leaf {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
      width: 100%;
      padding: 0.42rem 0.35rem 0.42rem 2.55rem;
      border: none;
      border-radius: 6px;
      background: none;
      cursor: pointer;
      text-align: left;
      font-size: 0.8rem;
      color: var(--text);
      position: relative;
    }
    .tree-leaf:hover { background: rgba(21, 33, 56, 0.6); }
    .tree-leaf.active { background: rgba(56, 189, 248, 0.15); color: var(--cyan); }
    .tree-leaf.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--cyan);
    }
    .tree-leaf .status-dot { align-self: center; }
    .tree-leaf .status-dot.automated { color: var(--lime); }
    .tree-leaf .status-dot.manual { color: var(--rose); }
    .tree-leaf .leaf-id { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }
    .tree-leaf.active .leaf-id { color: var(--cyan); }
    .tree-leaf .leaf-name { flex: 1; min-width: 0; line-height: 1.35; }
    .tree-leaf .leaf-known { color: var(--amber); font-size: 0.72rem; flex-shrink: 0; }

    .list-empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); font-size: 0.88rem; }

    .list-footer {
      padding: 0.5rem 1.25rem;
      border-top: 1px solid var(--line);
      background: rgba(16, 26, 45, 0.3);
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .list-footer code { font-family: var(--mono); }

    /* Detail pane */
    .detail-pane {
      height: 100vh;
      overflow-y: auto;
      min-width: 0;
    }
    .detail-pane::-webkit-scrollbar { width: 8px; }
    .detail-pane::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 4px; }

    .detail-header {
      padding: 1.5rem 2rem 1.2rem;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(16, 26, 45, 0.8), rgba(11, 18, 32, 0.4));
    }
    .detail-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }
    .detail-breadcrumbs .sep { color: rgba(148, 163, 184, 0.4); }
    .detail-breadcrumbs strong { color: var(--text); font-weight: 600; }
    .detail-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.25rem;
      margin-bottom: 0.85rem;
    }
    .detail-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin: 0;
    }
    .header-actions { display: flex; gap: 0.45rem; flex-shrink: 0; flex-wrap: wrap; }

    .btn-action {
      background: rgba(16, 26, 45, 0.8);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .btn-action:hover { background: rgba(21, 33, 56, 1); border-color: var(--cyan); color: var(--cyan); }
    .btn-action.copied { background: var(--teal-bg); border-color: var(--teal); color: var(--teal); }
    .btn-action.active {
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.25), rgba(56, 189, 248, 0.3));
      border-color: var(--cyan);
      color: #fff;
    }

    .meta-tags-row { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
    .chip {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .chip.id { font-family: var(--mono); color: var(--text); border-radius: 6px; }
    .chip.automated { color: #bef264; background: var(--lime-bg); border-color: rgba(163, 230, 53, 0.3); }
    .chip.manual { color: #fda4af; background: var(--rose-bg); border-color: rgba(251, 113, 133, 0.3); }
    .chip.known { color: #fcd34d; background: var(--amber-bg); border-color: rgba(251, 191, 36, 0.3); }
    .chip.role { color: #d8b4fe; background: var(--purple-bg); border-color: rgba(192, 132, 252, 0.3); }
    .chip.tag { font-family: var(--mono); color: #7dd3fc; background: rgba(56, 189, 248, 0.07); border-color: rgba(56, 189, 248, 0.16); border-radius: 4px; }

    .banner {
      margin: 1.25rem 2rem 0;
      padding: 0.95rem 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .banner.auto { background: linear-gradient(90deg, rgba(163, 230, 53, 0.08), rgba(16, 26, 45, 0.5)); border-color: rgba(163, 230, 53, 0.3); }
    .banner.manual { background: linear-gradient(90deg, rgba(251, 113, 133, 0.08), rgba(16, 26, 45, 0.5)); border-color: rgba(251, 113, 133, 0.3); }
    .banner.known { background: linear-gradient(90deg, rgba(251, 191, 36, 0.1), rgba(16, 26, 45, 0.5)); border-color: rgba(251, 191, 36, 0.3); }
    .banner.refs { background: rgba(16, 26, 45, 0.5); }
    .banner-left { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    .banner-title { font-size: 0.88rem; font-weight: 700; display: flex; align-items: center; gap: 0.45rem; }
    .banner.auto .banner-title { color: var(--lime); }
    .banner.manual .banner-title { color: var(--rose); }
    .banner.known .banner-title { color: var(--amber); }
    .banner.refs .banner-title { color: var(--text); }
    .banner-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
    .banner-desc a { color: #7dd3fc; }
    .banner-desc a:hover { text-decoration: underline; }
    .banner-actions { display: flex; gap: 0.45rem; flex-wrap: wrap; }
    .code {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: #7dd3fc;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .detail-tabs-bar {
      margin: 1.25rem 2rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.5rem;
    }
    .detail-tab {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .detail-tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .detail-tab.active { color: var(--cyan); background: var(--cyan-bg); }
    .detail-tabs-bar .btn-action { margin-left: auto; }

    .detail-content-area { padding: 1.25rem 2rem 2.5rem; }

    .steps-container { display: flex; flex-direction: column; gap: 0.6rem; }
    .step-card {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      background: rgba(16, 26, 45, 0.55);
      border: 1px solid var(--line);
    }
    .step-card:hover { background: rgba(21, 33, 56, 0.8); border-color: rgba(56, 189, 248, 0.25); }
    .step-card.verify { border-left: 2px solid rgba(163, 230, 53, 0.45); }
    .step-number {
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 700;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.22);
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-text { font-size: 0.92rem; line-height: 1.55; flex: 1; min-width: 0; overflow-wrap: anywhere; padding-top: 0.15rem; }
    .step-kw-action { color: var(--cyan); font-weight: 600; }
    .step-kw-verify { color: var(--lime); font-weight: 600; }
    .step-token-quote {
      color: #fef08a;
      background: rgba(254, 240, 138, 0.08);
      padding: 0.05rem 0.3rem;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.85em;
      border: 1px solid rgba(254, 240, 138, 0.2);
    }
    .step-token-endpoint { color: #93c5fd; font-family: var(--mono); font-size: 0.88em; }

    .yaml-container {
      background: #080d17;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem;
      overflow-x: auto;
    }
    .yaml-pre { margin: 0; font-family: var(--mono); font-size: 0.84rem; line-height: 1.6; color: #cbd5e1; white-space: pre; }
    .yaml-key { color: #7dd3fc; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--muted);
    }
    .empty-state svg { width: 64px; height: 64px; stroke: rgba(148, 163, 184, 0.35); margin-bottom: 1.25rem; }
    .empty-state h3 { font-size: 1.15rem; color: var(--text); margin: 0 0 0.5rem; }
    .empty-state p { font-size: 0.88rem; max-width: 440px; line-height: 1.5; margin: 0; }

    @media (max-width: 1100px) {
      .app-layout { display: flex; flex-direction: column; height: auto; overflow: visible; }
      .sidebar-pane { height: auto; border-right: none; border-bottom: 1px solid var(--line); }
      .scenarios-list { max-height: 420px; }
      .detail-pane { height: auto; overflow: visible; }
      .empty-state { min-height: 260px; }
    }

    @media (max-width: 640px) {
      .sidebar-header, .filter-box, .list-footer { padding-left: 16px; padding-right: 16px; }
      .scenarios-list { padding-left: 8px; padding-right: 8px; }
      .detail-header { padding: 1.1rem 16px 1rem; }
      .banner, .detail-tabs-bar { margin-left: 16px; margin-right: 16px; }
      .detail-content-area { padding: 1rem 16px 2rem; }
      .detail-title-row { flex-direction: column; gap: 0.75rem; }
      .detail-title { font-size: 1.2rem; }
      .kpi-card .lbl { font-size: 0.56rem; }
      .step-card { gap: 0.7rem; padding: 0.75rem 0.8rem; }
    }

    /* Bugs page */
    .num-open { color: var(--rose); }
    .num-recheck { color: var(--amber); }
    .num-fixed { color: var(--lime); }
    .filter-pill.active[data-status="open"] { background: var(--rose-bg); border-color: rgba(251, 113, 133, 0.4); color: var(--rose); }
    .filter-pill.active[data-status="recheck"] { background: var(--amber-bg); border-color: rgba(251, 191, 36, 0.4); color: var(--amber); }
    .filter-pill.active[data-status="fixed"] { background: var(--lime-bg); border-color: rgba(163, 230, 53, 0.4); color: var(--lime); }

    .filter-selects { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
    .filter-select {
      width: 100%;
      background: rgba(16, 26, 45, 0.85);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.78rem;
      padding: 0.35rem 0.5rem;
      outline: none;
    }
    .filter-select:focus { border-color: var(--cyan); }

    .sev-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; align-self: center; }
    .sev-critical { color: var(--rose); }
    .sev-major { color: var(--amber); }
    .sev-minor { color: var(--cyan); }
    .sev-trivial { color: var(--muted); }
    .tree-leaf.bug { padding-left: 1.6rem; }
    .tree-label.status { font-size: 0.85rem; font-weight: 700; }
    .tree-leaf .leaf-recheck { color: var(--amber); font-size: 0.72rem; flex-shrink: 0; }
    .tree-leaf .leaf-tests { color: var(--muted); font-size: 0.68rem; flex-shrink: 0; font-family: var(--mono); }

    .chip.open { color: #fda4af; background: var(--rose-bg); border-color: rgba(251, 113, 133, 0.3); }
    .chip.fixed { color: #bef264; background: var(--lime-bg); border-color: rgba(163, 230, 53, 0.3); }
    .chip.wont-fix { color: var(--muted); }
    .chip.severity { text-transform: capitalize; }
    .chip.severity.sev-critical { background: var(--rose-bg); border-color: rgba(251, 113, 133, 0.3); }
    .chip.severity.sev-major { background: var(--amber-bg); border-color: rgba(251, 191, 36, 0.3); }
    .chip.severity.sev-minor { background: var(--cyan-bg); border-color: rgba(56, 189, 248, 0.3); }
    .chip.date { font-family: var(--mono); font-weight: 500; }

    .test-list { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.35rem; }
    .test-row { display: flex; align-items: baseline; gap: 0.55rem; flex-wrap: wrap; }
    .test-row .test-id { font-family: var(--mono); font-size: 0.78rem; color: #7dd3fc; }
    .test-row .test-id:hover { text-decoration: underline; }
    .test-row .test-name { color: var(--text); flex: 1; min-width: 12rem; }
    .result-pill {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.08rem 0.45rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      white-space: nowrap;
    }
    .result-pill.fails { color: #fda4af; background: var(--rose-bg); border-color: rgba(251, 113, 133, 0.3); }
    .result-pill.passed { color: #fcd34d; background: var(--amber-bg); border-color: rgba(251, 191, 36, 0.3); }
    .result-pill.passes { color: #bef264; background: var(--lime-bg); border-color: rgba(163, 230, 53, 0.3); }

    .section { margin-bottom: 1.6rem; }
    .section h4 {
      margin: 0 0 0.6rem;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .prose { margin: 0; font-size: 0.92rem; line-height: 1.6; overflow-wrap: anywhere; }
    .outcome-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .outcome-card { padding: 0.85rem 1.1rem; border-radius: 12px; background: rgba(16, 26, 45, 0.55); border: 1px solid var(--line); }
    .outcome-card.expected { border-left: 2px solid rgba(163, 230, 53, 0.55); }
    .outcome-card.actual { border-left: 2px solid rgba(251, 113, 133, 0.55); }
    .outcome-card .label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.35rem; }
    .outcome-card.expected .label { color: var(--lime); }
    .outcome-card.actual .label { color: var(--rose); }
    .yaml-pre.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }

    @media (max-width: 640px) {
      .outcome-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar-pane">
      <div class="sidebar-header">
        <a href="../index.html" class="back-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Automation Portal
        </a>
        <div class="brand-title">
          <h1>Bugs</h1>
          <span class="brand-tag">App under test</span>
        </div>
        <div class="kpi-row">
          <button type="button" class="kpi-card" data-status="all" title="Show all bugs">
            <span class="num" id="kpi-total">-</span><span class="lbl">Total</span>
          </button>
          <button type="button" class="kpi-card" data-status="open" title="Show open bugs">
            <span class="num num-open" id="kpi-open">-</span><span class="lbl">Open</span>
          </button>
          <button type="button" class="kpi-card" data-status="recheck" title="Show open bugs whose test passed in the latest regression">
            <span class="num num-recheck" id="kpi-recheck">-</span><span class="lbl">Re-check</span>
          </button>
          <button type="button" class="kpi-card" data-status="fixed" title="Show fixed bugs">
            <span class="num num-fixed" id="kpi-fixed">-</span><span class="lbl">Fixed</span>
          </button>
        </div>
      </div>

      <div class="filter-box">
        <div class="search-input-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="bug-search" class="search-input" placeholder="Search ID, title, endpoint, scenario..." autocomplete="off" aria-label="Search bugs">
          <button type="button" id="clear-search" class="clear-search-btn" title="Clear search" hidden>✕</button>
        </div>
        <div class="filter-pills-container" role="group" aria-label="Filter by status">
          <button type="button" class="filter-pill active" data-status="all">All</button>
          <button type="button" class="filter-pill" data-status="open"><span class="status-dot" style="color: var(--rose)"></span>Open</button>
          <button type="button" class="filter-pill" data-status="recheck"><span class="status-dot" style="color: var(--amber)"></span>Re-check</button>
          <button type="button" class="filter-pill" data-status="fixed"><span class="status-dot" style="color: var(--lime)"></span>Fixed</button>
          <button type="button" class="filter-pill" data-status="wont-fix"><span class="status-dot" style="color: var(--muted)"></span>Won't fix</button>
        </div>
        <div class="filter-selects">
          <select id="filter-severity" class="filter-select" aria-label="Filter by severity">
            <option value="">All severities</option>
            <option value="critical">Critical</option>
            <option value="major">Major</option>
            <option value="minor">Minor</option>
            <option value="trivial">Trivial</option>
          </select>
          <select id="filter-layer" class="filter-select" aria-label="Filter by layer and area">
            <option value="">All layers and areas</option>
          </select>
        </div>
      </div>

      <div class="scenarios-list" id="bug-list"></div>

      <div class="list-footer">
        <span id="showing-count">Loading bugs...</span>
        <span id="generated-info"></span>
      </div>
    </aside>

    <main class="detail-pane">
      <div id="empty-state" class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M8 2l1.9 1.9M16 2l-1.9 1.9M9 7.1V6a3 3 0 1 1 6 0v1.1M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6zM12 20v-9M6 13H2M6 17l-3 2M18 13h4M18 17l3 2M6 9L3 7M18 9l3-2"/>
        </svg>
        <h3 id="empty-title">No bug selected</h3>
        <p id="empty-text">Pick a bug in the list to see how to reproduce it, the tests that cover it and their latest result.</p>
      </div>

      <div id="bug-detail" hidden>
        <header class="detail-header">
          <div class="detail-breadcrumbs" id="detail-breadcrumbs"></div>
          <div class="detail-title-row">
            <h2 class="detail-title" id="detail-title"></h2>
            <div class="header-actions">
              <button type="button" class="btn-action" id="btn-copy-link" data-label="Copy link">Copy link</button>
              <button type="button" class="btn-action" id="btn-copy-yaml" data-label="Copy YAML">Copy YAML</button>
            </div>
          </div>
          <div class="meta-tags-row" id="detail-chips"></div>
        </header>

        <div id="detail-banners"></div>

        <div class="detail-tabs-bar">
          <button type="button" class="detail-tab active" data-tab="details">Details</button>
          <button type="button" class="detail-tab" data-tab="yaml">YAML</button>
        </div>

        <div class="detail-content-area">
          <div id="tab-details"></div>
          <div id="tab-yaml" class="yaml-container" hidden><pre class="yaml-pre" id="yaml-content"></pre></div>
        </div>
      </div>
    </main>
  </div>

  <script src="bugs-data.js"></script>
  <script>
    (function () {
      const catalog = window.BUG_CATALOG;
      const $ = (id) => document.getElementById(id);
      const CHEVRON = '<span class="tree-toggle" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></span>';
      const STATUS_GROUPS = [['open', 'Open'], ['fixed', 'Fixed'], ['wont-fix', "Won't fix"]];
      const TITLE_ID = /^([A-Z]+-\d+):/;

      const state = {
        selectedId: null,
        tab: 'details',
        search: '',
        status: 'all',
        severity: '',
        layerArea: '',
        closed: new Set(),
        // Scenario ID -> its test's result in the latest regression of its layer.
        results: new Map(),
        resultsInfo: [],
      };

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function blobUrl(file, line) {
        const [filePath, anchor] = file.split('#');
        return `${catalog.repoUrl}/blob/${catalog.branch}/${filePath}${line ? `#L${line}` : anchor ? `#${anchor.toLowerCase()}` : ''}`;
      }

      function formatDate(iso) {
        return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      }

      function init() {
        if (!catalog) {
          $('showing-count').textContent = 'No bug data found.';
          $('empty-title').textContent = 'No bug data';
          $('empty-text').textContent = 'bugs-data.js is missing. Build it with npm run bugs:build.';
          return;
        }
        const layerAreas = [...new Set(catalog.bugs.map((b) => `${b.layer}/${b.area}`))].sort();
        $('filter-layer').insertAdjacentHTML('beforeend', layerAreas
          .map((key) => {
            const [layer, area] = key.split('/');
            return `<option value="${escapeHtml(key)}">${escapeHtml(`${catalog.layers[layer] ?? layer} / ${area}`)}</option>`;
          })
          .join(''));

        const commit = catalog.commit ? catalog.commit.slice(0, 7) : '';
        $('generated-info').innerHTML = `Updated ${escapeHtml(formatDate(catalog.generatedAt))}` +
          (commit ? ` · <a href="${escapeHtml(`${catalog.repoUrl}/commit/${catalog.commit}`)}" target="_blank" rel="noreferrer"><code>${escapeHtml(commit)}</code></a>` : '');

        bindEvents();
        readHash();
        render();
        loadResults().then(render);
      }

      // Playwright JSON report: suites (file -> describe blocks) -> specs (one per test title) -> tests (one per project).
      async function loadResults() {
        await Promise.all(catalog.regressions.map(async (regression) => {
          try {
            const response = await fetch(regression.results);
            if (!response.ok) return;
            const report = await response.json();
            const ranAt = report.stats?.startTime;
            state.resultsInfo.push({ ...regression, ranAt });
            const walk = (suite) => {
              (suite.specs || []).forEach((spec) => {
                const id = TITLE_ID.exec(spec.title)?.[1];
                const test = (spec.tests || [])[0];
                if (!id || !test) return;
                const last = (test.results || []).at(-1)?.status ?? 'skipped';
                state.results.set(id, { last, expectedStatus: test.expectedStatus, ranAt, regression });
              });
              (suite.suites || []).forEach(walk);
            };
            (report.suites || []).forEach(walk);
          } catch (error) {
            console.debug(`No results at ${regression.results}`, error);
          }
        }));
      }

      /** How a scenario's test did in the latest regression: fails (the bug is still there), passed (a known issue passed), passes, skipped or none. */
      function resultOf(scenario) {
        const result = state.results.get(scenario.id);
        if (!result) return { kind: 'none', text: scenario.status === 'manual' ? 'Manual' : 'Not in the latest run' };
        const when = result.ranAt ? ` on ${formatDate(result.ranAt)}` : '';
        if (result.last === 'skipped') return { kind: 'none', text: 'Skipped', title: `${result.regression.label}${when}` };
        const passed = result.last === 'passed';
        if (result.expectedStatus === 'failed') {
          return passed
            ? { kind: 'passed', text: 'Passed: re-check', title: `The known-issue test passed in the ${result.regression.label}${when}` }
            : { kind: 'fails', text: 'Bug still there', title: `The known-issue test failed as expected in the ${result.regression.label}${when}` };
        }
        return passed
          ? { kind: 'passes', text: 'Passes', title: `${result.regression.label}${when}` }
          : { kind: 'fails', text: 'Fails', title: `${result.regression.label}${when}` };
      }

      function needsRecheck(bug) {
        return bug.status === 'open' && bug.scenarios.some((s) => resultOf(s).kind === 'passed');
      }

      function bindEvents() {
        $('bug-search').addEventListener('input', (e) => {
          state.search = e.target.value.trim().toLowerCase();
          $('clear-search').hidden = !state.search;
          render();
        });
        $('clear-search').addEventListener('click', () => {
          $('bug-search').value = '';
          state.search = '';
          $('clear-search').hidden = true;
          $('bug-search').focus();
          render();
        });
        document.querySelectorAll('[data-status]').forEach((button) => {
          button.addEventListener('click', () => setStatus(button.dataset.status));
        });
        $('filter-severity').addEventListener('change', (e) => { state.severity = e.target.value; render(); });
        $('filter-layer').addEventListener('change', (e) => { state.layerArea = e.target.value; render(); });
        document.querySelectorAll('.detail-tab').forEach((tab) => {
          tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });
        $('btn-copy-yaml').addEventListener('click', (e) => copy(e.currentTarget, selected()?.yaml ?? ''));
        $('btn-copy-link').addEventListener('click', (e) => copy(e.currentTarget, location.href));
        window.addEventListener('hashchange', () => {
          readHash();
          render();
        });
        document.addEventListener('keydown', (e) => {
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            move(e.key === 'ArrowDown' ? 1 : -1);
          }
        });
      }

      function setStatus(status) {
        state.status = status;
        document.querySelectorAll('[data-status]').forEach((b) => b.classList.toggle('active', b.dataset.status === status && (b.classList.contains('filter-pill') || status !== 'all')));
        render();
      }

      function matches(bug) {
        if (state.status === 'recheck' && !needsRecheck(bug)) return false;
        if (!['all', 'recheck'].includes(state.status) && bug.status !== state.status) return false;
        if (state.severity && bug.severity !== state.severity) return false;
        if (state.layerArea && `${bug.layer}/${bug.area}` !== state.layerArea) return false;
        if (!state.search) return true;
        const text = [bug.id, bug.title, bug.status, bug.severity, bug.layer, bug.area, bug.description ?? '', bug.expected, bug.actual,
          ...bug.affects, ...bug.steps, ...bug.ref, ...bug.scenarios.flatMap((s) => [s.id, s.name])]
          .join(' ')
          .toLowerCase();
        return text.includes(state.search);
      }

      function visible() {
        // The list shows the bugs grouped by status, in the catalog's order inside each group.
        return STATUS_GROUPS.flatMap(([status]) => catalog.bugs.filter((b) => b.status === status && matches(b)));
      }

      function selected() {
        return catalog.bugs.find((b) => b.id === state.selectedId);
      }

      function render() {
        const { stats } = catalog;
        $('kpi-total').textContent = stats.total;
        $('kpi-open').textContent = stats.open;
        $('kpi-recheck').textContent = catalog.bugs.filter(needsRecheck).length;
        $('kpi-fixed').textContent = stats.fixed;

        const shown = visible();
        if (!shown.some((b) => b.id === state.selectedId)) state.selectedId = shown[0]?.id ?? null;
        renderList(shown);
        const loaded = state.resultsInfo.length
          ? ` · results: ${state.resultsInfo.map((r) => `${r.layer.toUpperCase()} ${r.ranAt ? formatDate(r.ranAt) : ''}`).join(', ')}`
          : '';
        $('showing-count').textContent = `Showing ${shown.length} of ${catalog.bugs.length} bugs${loaded}`;
        const bug = selected();
        if (bug) renderDetail(bug);
        else showEmpty(shown.length === 0 && catalog.bugs.length > 0);
      }

      function renderList(shown) {
        const list = $('bug-list');
        list.innerHTML = '';
        const fragment = document.createDocumentFragment();
        for (const [status, label] of STATUS_GROUPS) {
          const bugs = shown.filter((b) => b.status === status);
          if (bugs.length === 0) continue;
          const key = `status:${status}`;
          const open = !state.closed.has(key);
          const el = document.createElement('div');
          el.className = `tree-group${open ? '' : ' collapsed'}`;
          const header = document.createElement('button');
          header.type = 'button';
          header.className = 'tree-label status';
          header.setAttribute('aria-expanded', String(open));
          header.innerHTML = `${CHEVRON}<span class="label-text">${escapeHtml(label)}</span><span class="tree-count">${bugs.length}</span>`;
          header.addEventListener('click', () => {
            const nowOpen = el.classList.toggle('collapsed') === false;
            header.setAttribute('aria-expanded', String(nowOpen));
            nowOpen ? state.closed.delete(key) : state.closed.add(key);
          });
          const children = document.createElement('div');
          children.className = 'tree-children';
          bugs.forEach((bug) => children.appendChild(leaf(bug)));
          el.append(header, children);
          fragment.appendChild(el);
        }
        if (shown.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'list-empty';
          empty.textContent = catalog.bugs.length ? 'No bugs match the filters.' : 'No bugs recorded.';
          fragment.appendChild(empty);
        }
        list.appendChild(fragment);
      }

      function leaf(bug) {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = `tree-leaf bug${bug.id === state.selectedId ? ' active' : ''}`;
        item.dataset.id = bug.id;
        item.title = `${bug.id}: ${bug.title}`;
        const tests = bug.scenarios.length;
        item.innerHTML =
          `<span class="sev-dot sev-${escapeHtml(bug.severity)}" title="${escapeHtml(bug.severity)}"></span>` +
          `<span class="leaf-id">${escapeHtml(bug.id)}</span>` +
          `<span class="leaf-name">${escapeHtml(bug.title)}</span>` +
          (needsRecheck(bug) ? '<span class="leaf-recheck" title="A test passed in the latest regression: re-check">⟳</span>' : '') +
          `<span class="leaf-tests" title="${tests} scenario(s)">${tests}</span>`;
        item.addEventListener('click', () => select(bug.id));
        return item;
      }

      function select(id) {
        state.selectedId = id;
        const bug = selected();
        if (bug) state.closed.delete(`status:${bug.status}`);
        history.replaceState(null, '', `#bug=${encodeURIComponent(id)}`);
        render();
        document.querySelector('.tree-leaf.active')?.scrollIntoView({ block: 'nearest' });
      }

      function move(direction) {
        const shown = visible();
        if (shown.length === 0) return;
        const index = shown.findIndex((b) => b.id === state.selectedId);
        select(shown[Math.min(Math.max(index + direction, 0), shown.length - 1)].id);
      }

      function readHash() {
        const id = new URLSearchParams(location.hash.slice(1)).get('bug');
        if (id && catalog.bugs.some((b) => b.id === id)) state.selectedId = id;
      }

      function showEmpty(filteredOut) {
        $('empty-state').hidden = false;
        $('bug-detail').hidden = true;
        $('empty-title').textContent = filteredOut ? 'Nothing matches' : 'No bug selected';
        $('empty-text').textContent = filteredOut
          ? 'No bug matches the search and filters. Clear them to see every bug.'
          : 'Pick a bug in the list to see how to reproduce it, the tests that cover it and their latest result.';
      }

      function code(text) {
        return `<span class="code">${escapeHtml(text)}</span>`;
      }

      function fileLink(file, line) {
        return `<a href="${escapeHtml(blobUrl(file, line))}" target="_blank" rel="noreferrer">${code(line ? `${file.split('#')[0]}:${line}` : file)}</a>`;
      }

      function renderDetail(bug) {
        $('empty-state').hidden = true;
        $('bug-detail').hidden = false;

        $('detail-breadcrumbs').innerHTML =
          `<span>${escapeHtml(catalog.title)}</span><span class="sep">/</span>` +
          `<span>${escapeHtml(catalog.layers[bug.layer] ?? bug.layer)}</span><span class="sep">/</span>` +
          `<strong>${escapeHtml(bug.area)}</strong>`;
        $('detail-title').textContent = bug.title;

        const statusLabel = STATUS_GROUPS.find(([s]) => s === bug.status)?.[1] ?? bug.status;
        let chips = `<span class="chip id">${escapeHtml(bug.id)}</span>`;
        chips += `<span class="chip ${escapeHtml(bug.status)}"><span class="status-dot"></span>${escapeHtml(statusLabel)}</span>`;
        chips += `<span class="chip severity sev-${escapeHtml(bug.severity)}" title="Severity"><span class="sev-dot"></span>${escapeHtml(bug.severity)}</span>`;
        if (needsRecheck(bug)) chips += '<span class="chip known">⟳ Re-check</span>';
        chips += `<span class="chip date" title="Found">Found ${escapeHtml(bug.found)}</span>`;
        if (bug.resolved) chips += `<span class="chip date" title="Resolved">Resolved ${escapeHtml(bug.resolved)}</span>`;
        $('detail-chips').innerHTML = chips;

        renderBanners(bug);
        renderDetails(bug);
        $('yaml-content').innerHTML = escapeHtml(bug.yaml).replace(/^(\s*-?\s*)([A-Za-z]+):/gm, '$1<span class="yaml-key">$2</span>:');
        switchTab(state.tab);
      }

      function renderBanners(bug) {
        const banners = $('detail-banners');
        banners.innerHTML = '';

        const passed = bug.scenarios.filter((s) => resultOf(s).kind === 'passed');
        if (bug.status === 'open' && passed.length) {
          banners.appendChild(banner('known', 'Re-check: the bug may be fixed',
            `${passed.map((s) => code(s.id)).join(' ')} passed in the latest regression although ${passed.length === 1 ? 'it expects' : 'they expect'} this bug. ` +
            `Re-check it with ${code(`/report-bug recheck ${bug.id}`)}: if the app is fixed, the bug is closed (<span class="code">status: fixed</span>) and its scenarios and tests lose the known issue.`));
        }

        const rows = bug.scenarios.map((s) => {
          const result = resultOf(s);
          const testCases = `../test-cases/${encodeURIComponent(s.layer)}/#scenario=${encodeURIComponent(s.id)}`;
          return `<div class="test-row"><a class="test-id" href="${escapeHtml(testCases)}" target="_blank" rel="noreferrer" title="Open in the Test Cases page">${escapeHtml(s.id)}</a>` +
            `<span class="test-name">${escapeHtml(s.name)}</span>` +
            `<span class="result-pill ${result.kind}" title="${escapeHtml(result.title ?? '')}">${escapeHtml(result.text)}</span>` +
            (s.automatedIn ? fileLink(s.automatedIn, s.specLine) : '') + '</div>';
        });
        const regressionLinks = state.resultsInfo
          .map((r) => `<a href="${escapeHtml(r.report)}" target="_blank" rel="noreferrer">${escapeHtml(r.label)}</a>${r.ranAt ? ` (${escapeHtml(formatDate(r.ranAt))})` : ''}`)
          .join(', ');
        banners.appendChild(banner('refs', `Tests (${bug.scenarios.length})`,
          rows.length
            ? `<div class="test-list">${rows.join('')}</div>` +
              (regressionLinks ? `<div style="margin-top: 0.5rem">Results from the latest ${regressionLinks}.</div>` : '<div style="margin-top: 0.5rem">No regression results available here, so the latest results aren\'t shown.</div>')
            : 'No scenario names this bug yet. A scenario that hits it gets <span class="code">knownIssue</span> and <span class="code">bug: ' + escapeHtml(bug.id) + '</span>.'));

        const refs = bug.ref.map((ref) => (/^(docs|src|tests|test-scenarios)\//.test(ref) ? fileLink(ref) : code(ref)));
        banners.appendChild(banner('refs', 'Source',
          `Affects: ${bug.affects.map(code).join(' ')}` +
          `<br>Bug file: ${fileLink(bug.file)}` +
          (refs.length ? `<br>Expected behaviour from: ${refs.join(' ')}` : '') +
          (bug.upstream ? `<br>Reported upstream: <a href="${escapeHtml(bug.upstream)}" target="_blank" rel="noreferrer">${escapeHtml(bug.upstream)}</a>` : '')));
      }

      function banner(kind, title, descHtml) {
        const el = document.createElement('div');
        el.className = `banner ${kind}`;
        el.innerHTML = `<div class="banner-left"><div class="banner-title">${escapeHtml(title)}</div><div class="banner-desc">${descHtml}</div></div>`;
        return el;
      }

      function formatStep(raw) {
        let text = escapeHtml(raw);
        text = text.replace(/&quot;(.*?)&quot;/g, '<span class="step-token-quote">&quot;$1&quot;</span>');
        text = text.replace(/\b(GET|POST|PUT|PATCH|DELETE|QUERY) (\/[^\s,;:)]*[^\s,.;:)])/g, '<span class="step-token-endpoint">$1 $2</span>');
        text = text.replace(/^(Open|Click|Select|Enter|Set|Search|Send|Create|Add|Remove|Log in|Register|Type|Check|Clear|Pick|Go to|Compare)\b/, '<span class="step-kw-action">$1</span>');
        return text;
      }

      function renderDetails(bug) {
        let html = '';
        if (bug.description) html += `<div class="section"><h4>Description</h4><p class="prose">${escapeHtml(bug.description)}</p></div>`;
        html += `<div class="section"><h4>Steps to reproduce (${bug.steps.length})</h4><div class="steps-container">` +
          bug.steps.map((step, i) => `<div class="step-card"><div class="step-number">${i + 1}</div><div class="step-text">${formatStep(step)}</div></div>`).join('') +
          '</div></div>';
        html += '<div class="section"><div class="outcome-grid">' +
          `<div class="outcome-card expected"><span class="label">Expected</span><p class="prose">${formatStep(bug.expected)}</p></div>` +
          `<div class="outcome-card actual"><span class="label">Actual</span><p class="prose">${formatStep(bug.actual)}</p></div>` +
          '</div></div>';
        if (bug.evidence) html += `<div class="section"><h4>Evidence</h4><div class="yaml-container"><pre class="yaml-pre wrap">${escapeHtml(bug.evidence)}</pre></div></div>`;
        $('tab-details').innerHTML = html;
      }

      function switchTab(tab) {
        state.tab = tab;
        document.querySelectorAll('.detail-tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === tab));
        $('tab-details').hidden = tab !== 'details';
        $('tab-yaml').hidden = tab !== 'yaml';
      }

      function copy(button, text) {
        const done = () => {
          button.classList.add('copied');
          button.textContent = 'Copied';
          setTimeout(() => {
            button.classList.remove('copied');
            button.textContent = button.dataset.label;
          }, 1500);
        };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => {});
      }

      init();
    })();
  </script>
</body>
</html>
